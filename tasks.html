<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи клуба</title>
<meta name="theme-color" content="#7c6cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="tasks-manifest.json">
<!-- ⚠️ ИМЕНА С ПРЕФИКСОМ tasks-: каталог icons/ общий с дашбордом,
     и его favicon-32.png там уже занят. Свой набор не перетирает чужой -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/tasks-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/tasks-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/tasks-48.png">
<link rel="icon" href="icons/tasks-favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/tasks-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap');

/* ============================================================
   ДОСКА ЗАДАЧ В ЯЗЫКЕ ДАШБОРДА
   Переменные, тени, радиусы и шрифты взяты 1:1 из club-admin/index.html:
   светлая тема — тёплый картонный неоморфизм, тёмная — матовое стекло.
   ⚠️ ТОЛЬКО ВИЗУАЛЬНЫЙ СЛОЙ. Разметка, id, onclick и JS не тронуты,
   все прежние имена классов сохранены до единого.
   ============================================================ */

/* ── Светлая тема: Carton warm neumorphism ── */
[data-theme="light"]{
  --bg:        #e2dbd2;
  --bg-b:      #ddd6cc;
  --bg-c:      #ede6de;
  --surface:   #e2dbd2;
  --surface2:  #ddd6cc;
  --border:    rgba(194,186,176,0);
  --line:      rgba(100,80,60,0.09);
  --text:      #3a3028;
  --text-dim:  #7a6a60;
  --text-faint:#a89888;
  --card-bg:   #e2dbd2;
  --input-bg:  #e2dbd2;
  --stat-bg:   #ddd6cc;
  --sh-r:      6px 6px 16px #c2bab0, -6px -6px 16px #faf4ec;
  --sh-sm:     3px 3px 9px #c2bab0, -3px -3px 9px #faf4ec;
  --sh-i:      inset 5px 5px 12px #c2bab0, inset -5px -5px 12px #faf4ec;
  --sh-is:     inset 3px 3px 7px #c2bab0, inset -3px -3px 7px #faf4ec;
  --shadow:    var(--sh-r);
}
/* ── Тёмная тема: glassmorphism ── */
[data-theme="dark"]{
  --bg:        #0c0a15;
  --bg-b:      #110f1e;
  --bg-c:      #0c0a15;
  --surface:   rgba(255,255,255,0.05);
  --surface2:  rgba(255,255,255,0.09);
  --border:    rgba(255,255,255,0.08);
  --line:      rgba(255,255,255,0.06);
  --text:      #f0eefc;
  --text-dim:  #a29dc2;
  --text-faint:#655f80;
  --card-bg:   rgba(255,255,255,0.05);
  --input-bg:  rgba(255,255,255,0.07);
  --stat-bg:   rgba(255,255,255,0.07);
  --sh-r:      0 4px 20px -6px rgba(124,108,240,0.18);
  --sh-sm:     0 2px 12px -4px rgba(124,108,240,0.14);
  --sh-i:      inset 0 1px 0 rgba(255,255,255,0.06);
  --sh-is:     inset 0 1px 0 rgba(255,255,255,0.04);
  --shadow:    var(--sh-r);
}

:root{
  --lav:#9b8cf2; --lav-deep:#7c6cf0; --lav-dim:rgba(155,140,242,0.16);
  --peach:#ffb199; --mint:#8fe3c0; --coral:#ff8fa3;
  --green:#3ecf8e; --red:#ff453a;
  --accent:#e8614a; --accent-deep:#cf4f39;
  /* ⚠️ ИМЕНА ИЗ ПРЕЖНЕГО МАКЕТА ОСТАВЛЕНЫ ЖИВЫМИ. `--danger` и `--accent-2`
     зовут правила ниже, `--surface2` — атрибут stroke прямо в разметке
     кольца: правило с несуществующей переменной браузер отбрасывает
     целиком, и дуга легла бы на пустоту */
  --danger:var(--red); --accent-2:var(--mint);
  --disp:'Unbounded',sans-serif; --body:'Manrope',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);transition:background .3s}
body{
  font-family:var(--body);color:var(--text);font-size:15px;line-height:1.45;
  min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(800px 500px at -10% -10%,var(--bg-c),transparent 60%),
    radial-gradient(700px 500px at 110% 5%,var(--bg-b),transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  padding:0 0 calc(40px + env(safe-area-inset-bottom));
  transition:background .3s,color .3s;
}
/* Лавандовые блобы дашборда — тем же рецептом, но без лишних узлов
   в разметке: у доски своих `.blob` нет, поэтому рисуем псевдоэлементом */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(70px);
  pointer-events:none;z-index:0;opacity:0;transition:opacity .35s;
}
body::before{width:300px;height:300px;top:-100px;right:-80px;background:var(--lav)}
body::after{width:250px;height:250px;bottom:12%;left:-100px;background:var(--peach)}
[data-theme="dark"] body::before,[data-theme="dark"] body::after{opacity:.7}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px}

/* ── Шапка: тот же ритм, что на главной дашборда ────────── */
header{
  padding:calc(max(env(safe-area-inset-top), 8px) + 20px) 0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
h1{
  font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;min-width:0;
}
/* Знак «БП» — тот же, что в шапке дашборда (.mark), но собран из
   псевдоэлемента, чтобы не трогать разметку */
h1::before{
  content:"БП";flex:none;width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--lav),var(--coral));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:900;font-size:13px;color:#fff;
  box-shadow:0 6px 16px -4px rgba(155,140,242,0.45);
}
.head-acts{display:flex;gap:8px;align-items:center;flex:none}
.round{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-family:var(--body);cursor:pointer;transition:transform .15s;
}
.round:active{transform:scale(0.92)}
[data-theme="light"] .round{background:var(--bg);box-shadow:var(--sh-sm);border:none}
[data-theme="light"] .round:active{box-shadow:var(--sh-is)}
[data-theme="dark"] .round{background:var(--surface2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}

/* ── Сводка сверху: карточка KPI дашборда ──────────────── */
.hero{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:16px;margin:0 0 14px;box-shadow:var(--shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
[data-theme="light"] .hero{background:var(--bg);box-shadow:var(--sh-r);border:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.hero-row{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none;position:relative;display:grid;place-items:center;border-radius:50%}
[data-theme="light"] .ring{box-shadow:var(--sh-is)}
.ring svg{position:absolute;inset:2px;transform:rotate(-90deg)}
.ring svg circle{stroke-width:8}
/* Дуга прогресса — лавандой, как все числовые акценты дашборда.
   В разметке она объявлена атрибутом stroke, поэтому перебиваем правилом */
#ring-arc{stroke:var(--lav-deep)}
.ring-num{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:-.03em;color:var(--text)}
.hero-t{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;margin-bottom:4px}
.hero-x{font-size:12px;color:var(--text-dim)}
.hero-saved{font-size:11px;color:var(--text-faint);margin-top:8px;min-height:15px}

/* ── Разделы: пилюли периода из дашборда (.ptab) ───────── */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:none;cursor:pointer;font-family:var(--body);
  font-size:11px;font-weight:600;padding:6px 11px;border-radius:20px;
  background:rgba(124,108,240,0.08);color:var(--text-dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;
}
.tab.on{background:var(--lav-dim);color:var(--lav-deep)}
[data-theme="light"] .tab{background:var(--bg);box-shadow:var(--sh-sm);border:1px solid transparent}
[data-theme="light"] .tab.on{background:var(--lav-dim);box-shadow:none}
.tab i{font-style:normal;font-size:10px;font-weight:700;color:var(--text-faint)}
.tab.on i{color:var(--lav-deep)}

/* ── Группы и список задач: заголовок секции + .card ───── */
.group{margin-bottom:14px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.group-t{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint)}
.group-n{font-size:11px;font-weight:700;color:var(--text-faint)}
.list{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
[data-theme="light"] .list{background:var(--bg);box-shadow:var(--sh-r);border:none;backdrop-filter:none;-webkit-backdrop-filter:none}

/* Строка задачи повторяет .list-item дашборда: разделитель линией,
   подсветка лавандой на нажатие */
.task{
  display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:background .12s;
}
.task:last-child{border-bottom:none}
.task:active{background:rgba(155,140,242,0.08)}
.box{
  width:24px;height:24px;flex:none;border-radius:8px;margin-top:1px;
  background:var(--stat-bg);border:1px solid var(--border);
  display:grid;place-items:center;color:transparent;
  font-size:13px;font-weight:700;transition:.18s cubic-bezier(.2,.8,.2,1);
}
/* Квадрат отметки мельче карточек, поэтому и вдавленность мельче:
   на 24 пикселях штатный --sh-is съедает середину и читается пятном */
[data-theme="light"] .box{background:var(--bg);border:none;
  box-shadow:inset 2px 2px 5px #c2bab0, inset -2px -2px 5px #faf4ec}
.task.done .box{
  background:linear-gradient(135deg,var(--lav),var(--lav-deep));
  box-shadow:0 6px 16px -4px rgba(155,140,242,0.45);border:none;color:#fff;
}
.task-t{font-size:13px;line-height:1.4;font-weight:600}
.task.done .task-t{color:var(--text-faint);text-decoration:line-through;text-decoration-thickness:1px}
.task-n{display:block;font-size:11px;color:var(--text-faint);margin-top:3px;text-decoration:none;line-height:1.45}
.task.done .task-n{opacity:.55}

/* Метки — те же плашки, что .badge в дашборде */
.tag{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:20px;margin-right:6px;vertical-align:1px;
  background:var(--stat-bg);color:var(--text-faint);
}
.tag.hot{background:rgba(232,97,74,0.14);color:var(--accent-deep)}
.tag.me{background:var(--lav-dim);color:var(--lav-deep)}
.tag.plan{background:rgba(62,207,142,0.15);color:#1a9466}
[data-theme="dark"] .tag.hot{color:var(--peach)}
[data-theme="dark"] .tag.plan{color:var(--mint)}
.del{
  margin-left:auto;flex:none;border:none;background:transparent;cursor:pointer;
  color:var(--text-faint);font-size:15px;padding:0 2px;font-family:var(--body);
}
.del:active{color:var(--red)}

/* ── Добавление задачи: поле и кнопка попапа дашборда ──── */
.adder{display:flex;gap:8px;margin:14px 0 6px}
.adder input,.adder select{
  flex:1;min-width:0;font-family:var(--body);font-size:13px;
  padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--input-bg);color:var(--text);outline:none;transition:box-shadow .15s;
}
.adder input::placeholder{color:var(--text-faint)}
.adder select{-webkit-appearance:none;appearance:none;color:var(--text-dim);font-size:12.5px}
.adder input:focus,.adder select:focus{box-shadow:0 0 0 2px var(--lav-dim)}
.adder select:disabled{opacity:.5}
.adder button{
  flex:none;width:46px;border:none;cursor:pointer;border-radius:14px;
  background:var(--accent);color:#fff;font-family:var(--disp);font-weight:700;
  font-size:19px;transition:opacity .15s;
}
.adder button:active{opacity:.8}

.empty{padding:24px;text-align:center;color:var(--text-faint);font-size:13px}
.foot{text-align:center;font-size:11px;color:var(--text-faint);margin-top:20px}
.linky{
  border:1px solid var(--border);cursor:pointer;font-family:var(--body);
  font-size:12px;font-weight:600;color:var(--text);
  padding:9px 16px;border-radius:14px;background:var(--stat-bg);transition:all .15s;
}
[data-theme="light"] .linky{background:var(--bg);box-shadow:var(--sh-sm);border:none}
[data-theme="light"] .linky:active{box-shadow:var(--sh-is)}
.linky:active{opacity:.75;transform:scale(0.97)}

/* ── Экран пин-кода: тот же фон и те же поверхности ────── */
.pin-screen{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:
    radial-gradient(800px 500px at -10% -10%,var(--bg-c),transparent 60%),
    radial-gradient(700px 500px at 110% 5%,var(--bg-b),transparent 55%),
    var(--bg);
}
.pin-screen.hidden{display:none}
.pin-logo{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,var(--lav),var(--coral));color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:18px;
  box-shadow:0 10px 24px -6px rgba(155,140,242,0.5);
}
.pin-title{font-size:13px;color:var(--text-dim);font-weight:600}
.pin-dots{display:flex;gap:12px;padding:10px 14px;border-radius:99px;background:var(--stat-bg)}
[data-theme="light"] .pin-dots{background:var(--bg);box-shadow:var(--sh-is)}
.pin-dot{width:11px;height:11px;border-radius:50%;background:var(--surface2);transition:background .15s}
.pin-dot.filled{background:linear-gradient(135deg,var(--lav),var(--lav-deep));box-shadow:0 4px 10px -2px rgba(155,140,242,0.5)}
.pin-error{font-size:12.5px;color:var(--red);min-height:18px;text-align:center;padding:0 24px}
.pin-pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px}
.pin-btn{
  width:68px;height:68px;border-radius:22px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  font-family:var(--disp);font-weight:700;font-size:20px;cursor:pointer;transition:transform .15s;
}
.pin-btn:active{transform:scale(0.94)}
.pin-btn.del{font-family:var(--body);font-weight:600;font-size:16px;color:var(--text-dim)}
[data-theme="light"] .pin-btn{background:var(--bg);box-shadow:var(--sh-r);border:none}
[data-theme="light"] .pin-btn:active{box-shadow:var(--sh-i)}
[data-theme="dark"] .pin-btn{backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}

/* ── Узкие экраны ─────────────────────────────────────── */
@media (max-width:420px){
  .wrap{padding:0 13px}
  h1{font-size:14px}
  .ring{width:76px;height:76px}
  .pin-pad{grid-template-columns:repeat(3,64px);gap:12px}
  .pin-btn{width:64px;height:64px}
}
</style>
</head>
<body>


<div class="pin-screen" id="pin-screen">
  <div class="pin-logo">БП</div>
  <div class="pin-title">Введите пин-код</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinKey('1')">1</button>
    <button class="pin-btn" onclick="pinKey('2')">2</button>
    <button class="pin-btn" onclick="pinKey('3')">3</button>
    <button class="pin-btn" onclick="pinKey('4')">4</button>
    <button class="pin-btn" onclick="pinKey('5')">5</button>
    <button class="pin-btn" onclick="pinKey('6')">6</button>
    <button class="pin-btn" onclick="pinKey('7')">7</button>
    <button class="pin-btn" onclick="pinKey('8')">8</button>
    <button class="pin-btn" onclick="pinKey('9')">9</button>
    <button class="pin-btn del" onclick="pinKey('del')">⌫</button>
    <button class="pin-btn" onclick="pinKey('0')">0</button>
    <button class="pin-btn del" onclick="pinKey('clear')">C</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>Задачи клуба</h1>
    <div class="head-acts">
      <button class="round" onclick="dropAllDone()" title="Убрать закрытые">✕</button>
      <button class="round" onclick="toggleTheme()" title="Тема">◐</button>
      <button class="round" onclick="location.href='./'" title="К дашборду">←</button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-row">
      <div class="ring">
        <svg viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface2)" stroke-width="9"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="9"
                  stroke-linecap="round" id="ring-arc" stroke-dasharray="0 999"/>
        </svg>
        <div class="ring-num" id="ring-num">0%</div>
      </div>
      <div style="min-width:0">
        <div class="hero-t" id="hero-t">Считаю…</div>
        <div class="hero-x" id="hero-x"></div>
        <div class="hero-saved" id="hero-saved"></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="body"></div>

  <div class="adder">
    <input id="new-task" placeholder="Своя задача в этот раздел…"
           onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">+</button>
  </div>
  <div class="adder"><select id="new-group"></select></div>

  <div class="foot"><button class="linky" id="show-done" onclick="toggleDone()">Показать сделанное</button>
    <div style="margin-top:11px">доска задач · <span id="build">tasks-v7</span></div></div>
</div>

<script>
const API = 'https://api.youselllikeagod-magazine.ru';
const ADMIN_TOKEN_KEY = 'admin_token';
const DOC_KEY = 'tasks';
let ADMIN_TOKEN = '';
try { ADMIN_TOKEN = sessionStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch(e) {}

/* ═══ ЗАДАЧИ ЖИВУТ НА СЕРВЕРЕ ═════════════════════════════════════════════════
   ⚠️ РАНЬШЕ ТЕКСТЫ БЫЛИ ЗАШИТЫ В ЭТОТ ФАЙЛ, а на сервере лежали только
   отметки. Тогда «добавить задачу» означало перевыложить страницу. Теперь весь
   список — документ `tasks` в админском хранилище: правится и отсюда, и одной
   командой из терминала.

   Документ: { v:2, sections:[{key,title}], items:[{id,sec,g,t,n,tag,done}] }
   `done` — дата строкой или пусто. Группы берутся ИЗ ПОРЯДКА `items`: первая
   встреченная группа идёт первой. Так порядок задаётся заливкой, а не
   отдельным полем, которое пришлось бы держать в согласии со списком.

   ⚠️ ПИШЕМ ТОЛЬКО ПАТЧАМИ, НЕ ДОКУМЕНТОМ ЦЕЛИКОМ: доску правят с двух сторон,
   и вкладка, открытая со вчера, не должна затирать добавленное мимо неё. */
const FALLBACK_SECTIONS = [
  { key:'dev',  title:'Разработка'   },
  { key:'test', title:'Тестирование' },
  { key:'fill', title:'Наполнение'   },
  { key:'ask',  title:'Решить'       }
];
let SECTIONS = FALLBACK_SECTIONS.slice();
let ITEMS = [];
/* ⚠️ РАЗДЕЛ ЛЕКЦИЙ НЕ ХРАНИТСЯ НА ДОСКЕ — он считается сервером из самой базы
   лекций. Иначе новая лекция не появлялась бы, пока её не занесут руками, а
   заполненное поле не убирало бы строку «нет таймкодов». На доске живёт только
   галочка «эту я доделал», задача заводится в момент первого нажатия */
const LEC_SEC = 'lec';
let LECTURES = [];
let CHECKS = {};
let cur = 'dev';
let showDone = false;
let saveTimer = null;
let pending = { add:[], remove:[], done:[], undone:[] };

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function sectionItems(sec){
  /* Группы — в порядке первого появления в `items`. Пустые (когда всё в них
     закрыто, а закрытое спрятано) не рисуем вовсе */
  const out = [];
  const byName = {};
  allItems(sec).forEach(function(it){
    if (it.done && !showDone) return;
    const g = it.g || 'Разное';
    if (!byName[g]){ byName[g] = { g:g, items:[] }; out.push(byName[g]); }
    byName[g].items.push(it);
  });
  return out;
}
function allItems(sec){
  /* ⚠️ В РАЗДЕЛЕ ЛЕКЦИЙ ДВА РОДА СТРОК. Из базы приходит то, что уже записано;
     свои строки — это ПЛАН на потоки, которых ещё нет. Сервер про них знать не
     может, а планировать наперёд надо. Плановые идут ПОСЛЕ настоящих внутри
     своей группы, чтобы записанное было видно первым */
  const own = ITEMS.filter(function(i){ return i.sec === sec; });
  if (sec !== LEC_SEC) return own;
  const real = lectureRows();
  const seen = {};
  real.forEach(function(r){ seen[r.id] = true; });
  return real.concat(own.filter(function(i){ return !seen[i.id]; }));
}
function tabs(){
  const t = SECTIONS.slice();
  if (LECTURES.length) t.push({ key:LEC_SEC, title:'Лекции' });
  return t;
}
/* Строка лекции — это её готовность ИЗ БАЗЫ плюс отметка С ДОСКИ, если она
   уже ставилась. Ключ задачи привязан к слагу, поэтому переименование лекции
   отметку не теряет */
function lectureRows(){
  return LECTURES.map(function(l){
    const id = 'lec:' + l.slug;
    const saved = ITEMS.filter(function(i){ return i.id === id; })[0];
    const miss = (l.missing || []).map(function(k){ return CHECKS[k] || k; });
    return { id:id, sec:LEC_SEC, g:l.group || 'Вне потоков', t:l.title,
             n: miss.length ? 'нет: ' + miss.join(', ') : 'всё на месте',
             done: saved ? saved.done : '', lecture:true };
  });
}
function doneCount(list){ return list.filter(function(i){ return !!i.done; }).length; }
function findItem(id){
  for (let i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
  return null;
}

function render(){
  document.getElementById('tabs').innerHTML = tabs().map(function(s){
    const list = allItems(s.key);
    return '<button class="tab' + (s.key===cur ? ' on' : '') + '" onclick="switchTab(\'' + s.key + '\')">'
      + esc(s.title) + '<i>' + doneCount(list) + '/' + list.length + '</i></button>';
  }).join('');

  const groups = sectionItems(cur);
  let h = '';
  groups.forEach(function(g){
    const total = allItems(cur).filter(function(i){ return (i.g || 'Разное') === g.g; });
    h += '<div class="group"><div class="group-head">'
       + '<div class="group-t">' + esc(g.g) + '</div>'
       + '<div class="group-n">' + doneCount(total) + ' из ' + total.length + '</div></div><div class="list">';
    g.items.forEach(function(it){
      h += '<div class="task' + (it.done ? ' done' : '') + '" onclick="toggle(\'' + esc(it.id) + '\')">'
         + '<div class="box">✓</div><div style="min-width:0"><div class="task-t">'
         + (it.tag === 'hot' ? '<span class="tag hot">срочное</span>' : '')
         + (it.tag === 'me'  ? '<span class="tag me">за мной</span>'  : '')
         + (it.tag === 'plan' ? '<span class="tag plan">план</span>'  : '')
         + esc(it.t) + '</div>'
         + (it.n ? '<span class="task-n">' + esc(it.n) + '</span>' : '')
         + '</div>'
         + (it.lecture ? ''
            : '<button class="del" onclick="event.stopPropagation();dropTask(\'' + esc(it.id) + '\')">✕</button>')
         + '</div>';
    });
    h += '</div></div>';
  });
  if (!groups.length){
    h = '<div class="list"><div class="empty">'
      + (ITEMS.length ? 'Здесь всё закрыто' : 'Список пуст — залей задачи командой из чата')
      + '</div></div>';
  }
  document.getElementById('body').innerHTML = h;

  let all = 0, dn = 0;
  tabs().forEach(function(s){
    const list = allItems(s.key);
    all += list.length; dn += doneCount(list);
  });
  const pct = all ? Math.round(dn * 100 / all) : 0;
  const arc = document.getElementById('ring-arc');
  const len = 2 * Math.PI * 36;
  arc.setAttribute('stroke-dasharray', (len * pct / 100).toFixed(1) + ' ' + len.toFixed(1));
  document.getElementById('ring-num').textContent = pct + '%';
  document.getElementById('hero-t').textContent = heroTitle(pct);
  document.getElementById('hero-x').textContent = 'Закрыто ' + dn + ' из ' + all
    + ' · осталось ' + (all - dn);
  const sw = document.getElementById('show-done');
  if (sw) sw.textContent = showDone ? 'Скрыть сделанное' : 'Показать сделанное';
  const inp = document.getElementById('new-task');
  if (inp) inp.placeholder = (cur === LEC_SEC)
    ? 'Запланировать занятие — впишется в поток…'
    : 'Своя задача в этот раздел…';

  /* Список групп текущего раздела — берётся из ВСЕХ задач, не только видимых:
     иначе группа, где всё закрыто, пропадала бы из выбора */
  const sel = document.getElementById('new-group');
  if (sel){
    const seen = [];
    allItems(cur).forEach(function(i){
      const g = i.g || 'Мои';
      if (seen.indexOf(g) < 0) seen.push(g);
    });
    if (seen.indexOf('Мои') < 0) seen.push('Мои');
    const keep = sel.value;
    sel.innerHTML = seen.map(function(g){
      return '<option value="' + esc(g) + '">' + esc(g) + '</option>';
    }).join('') + '<option value="__new__">+ новая группа…</option>';
    if (seen.indexOf(keep) >= 0 || keep === '__new__') sel.value = keep;
    sel.disabled = false;
  }
}

function heroTitle(p){
  if (p === 0)   return 'Начинаем';
  if (p < 15)    return 'Первые сдвинулись';
  if (p < 35)    return 'Пошло дело';
  if (p < 55)    return 'Уже видно берег';
  if (p < 75)    return 'Больше половины позади';
  if (p < 95)    return 'Финальный бросок';
  if (p < 100)   return 'Почти всё';
  return 'Готово. Всё.';
}

function switchTab(k){ cur = k; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function toggleDone(){ showDone = !showDone; render(); }

function toggle(id){
  if (id.indexOf('lec:') === 0) return toggleLecture(id);
  const it = findItem(id);
  if (!it) return;
  if (it.done){ it.done = ''; markPending('undone', 'done', id); }
  else { it.done = new Date().toISOString().slice(0,10); markPending('done', 'undone', id); }
  render();
  save();
}

/* ⚠️ У ЛЕКЦИИ ЗАДАЧИ МОЖЕТ ЕЩЁ НЕ БЫТЬ. Первое нажатие её создаёт и сразу
   отмечает — двумя действиями в одном патче, иначе `done` не к чему прицепить */
function toggleLecture(id){
  const row = lectureRows().filter(function(r){ return r.id === id; })[0];
  if (!row) return;
  const saved = findItem(id);
  if (saved && saved.done){
    saved.done = '';
    markPending('undone', 'done', id);
  } else if (saved){
    saved.done = new Date().toISOString().slice(0,10);
    markPending('done', 'undone', id);
  } else {
    const it = { id:id, sec:LEC_SEC, g:row.g, t:row.t,
                 done:new Date().toISOString().slice(0,10) };
    ITEMS.push(it);
    pending.add.push(it);
  }
  render();
  save();
}

function addTask(){
  const inp = document.getElementById('new-task');
  const text = (inp.value || '').trim();
  if (!text) return;
  /* Группа: выбранная в списке, либо своя по кнопке «новая». Так и получаются
     подсписки — «Поток про возражения» и что угодно ещё */
  let g = document.getElementById('new-group').value || 'Мои';
  if (g === '__new__'){
    g = (prompt('Название новой группы:') || '').trim();
    if (!g) return;
  }
  const it = { id:'x' + Date.now().toString(36), sec:cur, g:g, t:text, done:'' };
  // В разделе лекций своя строка — это план: метка отличает её от записанного
  if (cur === LEC_SEC) it.tag = 'plan';
  ITEMS.push(it);
  pending.add.push(it);
  inp.value = '';
  render();
  save();
}

function dropTask(id){
  const it = findItem(id);
  if (!it) return;
  if (!confirm('Убрать задачу «' + it.t + '» насовсем?')) return;
  ITEMS = ITEMS.filter(function(i){ return i.id !== id; });
  dropPending(id);
  render();
  save();
}

function dropAllDone(){
  const n = ITEMS.filter(function(i){ return !!i.done; }).length;
  if (!n) return;
  if (!confirm('Убрать все закрытые задачи (' + n + ') насовсем?')) return;
  ITEMS.filter(function(i){ return !!i.done; }).forEach(function(i){ dropPending(i.id); });
  ITEMS = ITEMS.filter(function(i){ return !i.done; });
  render();
  save();
}

/* ⚠️ КОПИМ ПРАВКИ И ШЛЁМ ПАЧКОЙ. Отметить десять задач подряд — обычное дело,
   и десять запросов ни к чему; при уходе со страницы пачка дожимается */
/* ⚠️ ОДНА ЗАДАЧА — ОДНО РЕШЕНИЕ В ПАЧКЕ. Поймано на стенде: отметил, снял,
   снова отметил — и в патче ехали и `done`, и `undone` для того же ключа.
   Сервер применяет `undone` последним, так что на экране галочка стояла бы, а
   в базе снялась. Держим ПОСЛЕДНЕЕ действие: кладя ключ в один список, убираем
   его из противоположного */
function markPending(list, other, id){
  const i = pending[other].indexOf(id);
  if (i >= 0) pending[other].splice(i, 1);
  if (pending[list].indexOf(id) < 0) pending[list].push(id);
}
/* Задача, созданная и удалённая до отправки, на сервер не ездила вовсе —
   слать `remove` по ключу, которого там нет, незачем */
function dropPending(id){
  const i = pending.add.map(function(x){ return x.id; }).indexOf(id);
  markPending('remove', 'add', id);
  if (i >= 0){
    pending.add.splice(i, 1);
    const j = pending.remove.indexOf(id);
    if (j >= 0) pending.remove.splice(j, 1);
  }
  ['done','undone'].forEach(function(k){
    const j = pending[k].indexOf(id);
    if (j >= 0) pending[k].splice(j, 1);
  });
}

function save(){
  clearTimeout(saveTimer);
  setSaved('сохраняю…');
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow(){
  clearTimeout(saveTimer);
  saveTimer = null;
  const batch = pending;
  if (!batch.add.length && !batch.remove.length && !batch.done.length && !batch.undone.length) return;
  pending = { add:[], remove:[], done:[], undone:[] };
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '/patch?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(batch)
    });
    if (!r.ok) throw new Error('код ' + r.status);
    setSaved('сохранено ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}));
  } catch (e) {
    /* ⚠️ ВОЗВРАЩАЕМ ПАЧКУ В ОЧЕРЕДЬ, а не теряем: следующая правка увезёт её
       вместе со своей. Иначе отметка выглядела бы поставленной на экране и
       пропадала при перезагрузке */
    pending.add = batch.add.concat(pending.add);
    pending.remove = batch.remove.concat(pending.remove);
    pending.done = batch.done.concat(pending.done);
    pending.undone = batch.undone.concat(pending.undone);
    setSaved('не сохранилось (' + e.message + ') — попробую с следующей правкой');
  }
}
function setSaved(s){ const el = document.getElementById('hero-saved'); if (el) el.textContent = s; }

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') saveNow();
});

/* ⚠️ ОТКАЗ ПО ЛЕКЦИЯМ НЕ ДОЛЖЕН РОНЯТЬ ДОСКУ: раздел просто не появится,
   остальные четыре работают как работали */
async function loadLectures(){
  try {
    const r = await fetch(API + '/admin/lectures/readiness?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN));
    if (!r.ok) throw new Error('код ' + r.status);
    const d = await r.json();
    LECTURES = Array.isArray(d.items) ? d.items.filter(function(l){ return l && l.slug; }) : [];
    CHECKS = {};
    (d.checks || []).forEach(function(c){ if (c && c.key) CHECKS[c.key] = c.label; });
  } catch (e) {
    LECTURES = [];
  }
}

async function loadAll(){
  document.getElementById('app').style.display = '';
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN));
    if (!r.ok) throw new Error('код ' + r.status);
    const d = await r.json();
    const data = d.data || {};
    /* Что пришло — проверяем: пустой или битый документ не должен ронять
       страницу, доска обязана открываться и когда сохранять ещё нечего */
    ITEMS = Array.isArray(data.items)
      ? data.items.filter(function(i){ return i && i.id && i.t; })
      : [];
    SECTIONS = (Array.isArray(data.sections) && data.sections.length)
      ? data.sections.filter(function(s){ return s && s.key && s.title; })
      : FALLBACK_SECTIONS.slice();
    if (!SECTIONS.some(function(s){ return s.key === cur; }) && SECTIONS.length) cur = SECTIONS[0].key;
    await loadLectures();
    setSaved(d.updated_at ? 'последняя правка: ' + new Date(d.updated_at).toLocaleString('ru-RU',
      {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '');
  } catch (e) {
    setSaved('не удалось прочитать список (' + e.message + ')');
  }
  render();
}

function toggleTheme(){
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', html.dataset.theme); } catch(e) {}
}
(function(){
  let saved = 'light';
  try { saved = localStorage.getItem('theme') || 'light'; } catch(e) {}
  document.documentElement.dataset.theme = saved;
})();

/* ═══ ПИН ═════════════════════════════════════════════════════════════════════
   Тот же механизм, что в дашборде: пин уходит на сервер, обратно приходит ключ
   на 12 часов. ⚠️ Ключ лежит в sessionStorage, а он у каждой вкладки свой —
   значит вход сюда отдельный от дашборда, это нормально, а не поломка */
const PIN_LENGTH = 5;
let pinEntered = '';
let pinBusy = false;

async function submitPin(){
  const err = document.getElementById('pin-error');
  pinBusy = true;
  try {
    const r = await fetch(API + '/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pin: pinEntered })
    });
    const data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.detail || 'Не получилось войти');
    ADMIN_TOKEN = data.token;
    try { sessionStorage.setItem(ADMIN_TOKEN_KEY, data.token); } catch(e) {}
    err.textContent = '';
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  } catch (e) {
    err.textContent = e.message;
  } finally {
    pinBusy = false;
    pinEntered = '';
    for (let i = 0; i < PIN_LENGTH; i++){
      const d = document.getElementById('d'+i);
      if (d) d.classList.remove('filled');
    }
  }
}
function pinKey(k){
  const err = document.getElementById('pin-error');
  err.textContent = '';
  if (k === 'del') pinEntered = pinEntered.slice(0,-1);
  else if (k === 'clear') pinEntered = '';
  else if (pinEntered.length < PIN_LENGTH && !pinBusy) pinEntered += k;
  for (let i = 0; i < PIN_LENGTH; i++){
    document.getElementById('d'+i).classList.toggle('filled', i < pinEntered.length);
  }
  if (pinEntered.length === PIN_LENGTH) submitPin();
}
document.addEventListener('keydown', function(e){
  if (document.getElementById('pin-screen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('del');
  else if (e.key === 'Escape') pinKey('clear');
});
(function(){
  if (ADMIN_TOKEN){
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  }
})();
</script>
