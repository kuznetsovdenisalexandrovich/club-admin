<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи клуба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700;900&display=swap');

/* ============================================================
   TACTILE LIGHT / SMOKED GLASS DARK
   Только визуальный слой. Разметка, id, onclick и JS не тронуты.
   ============================================================ */
:root{
  --bg:#eee9e2;
  --bg2:#f7f3ed;
  --surface:#eee9e2;
  --surface-hi:#f8f4ef;
  --surface-lo:#ddd6cd;
  --line:rgba(89,72,60,.10);
  --text:#29231f;
  --text-dim:#746a62;
  --text-faint:#a29991;
  --accent:#7867ea;
  --accent-2:#68bba6;
  --warm:#dc8261;
  --danger:#dd6e73;
  --disp:'Unbounded', system-ui, sans-serif;

  --shadow-out:
    14px 16px 32px rgba(139,125,111,.25),
    -11px -11px 24px rgba(255,255,255,.92),
    inset 1px 1px 0 rgba(255,255,255,.95),
    inset -1px -1px 0 rgba(121,105,92,.06);
  --shadow-out-sm:
    7px 8px 16px rgba(139,125,111,.22),
    -6px -6px 13px rgba(255,255,255,.9),
    inset 1px 1px 0 rgba(255,255,255,.85);
  --shadow-in:
    inset 8px 8px 16px rgba(145,131,118,.20),
    inset -8px -8px 16px rgba(255,255,255,.92),
    1px 1px 0 rgba(255,255,255,.55);
  --shadow-in-sm:
    inset 4px 4px 9px rgba(145,131,118,.20),
    inset -4px -4px 9px rgba(255,255,255,.9);
}

[data-theme="dark"]{
  --bg:#0a0b10;
  --bg2:#10131a;
  --surface:rgba(255,255,255,.075);
  --surface-hi:rgba(255,255,255,.11);
  --surface-lo:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.08);
  --text:#f5f2ff;
  --text-dim:#b1aec2;
  --text-faint:#706c82;
  --accent:#9c8cff;
  --accent-2:#70d9bc;
  --warm:#ff9d6e;
  --danger:#ff6d78;

  --shadow-out:
    0 18px 52px rgba(0,0,0,.48),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(255,255,255,.02);
  --shadow-out-sm:
    0 10px 28px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.11);
  --shadow-in:
    inset 0 1px 1px rgba(255,255,255,.08),
    inset 0 -16px 30px rgba(0,0,0,.16);
  --shadow-in-sm:
    inset 0 1px 1px rgba(255,255,255,.07),
    inset 0 -8px 18px rgba(0,0,0,.15);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;color:var(--text);font-family:'Manrope',system-ui,sans-serif;
  font-size:15px;line-height:1.45;padding:0 0 calc(46px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(255,255,255,.82), transparent 58%),
    radial-gradient(700px 440px at 110% 18%, rgba(212,196,224,.22), transparent 62%),
    linear-gradient(145deg,var(--bg2),var(--bg));
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(96,75,61,.13) .55px, transparent .55px);
  background-size:4px 4px;mask-image:linear-gradient(to bottom,black,transparent 78%);
}
[data-theme="dark"] body{
  background:
    radial-gradient(900px 520px at 12% -12%, rgba(117,88,255,.20), transparent 58%),
    radial-gradient(800px 580px at 110% 12%, rgba(41,220,183,.11), transparent 62%),
    radial-gradient(760px 580px at 70% 105%, rgba(255,128,79,.08), transparent 64%),
    linear-gradient(180deg,#0d0f16,#08090d 72%);
}
[data-theme="dark"] body::before{opacity:.12;mix-blend-mode:screen;background-size:5px 5px}

.wrap{max-width:720px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* ── header ───────────────────────────────────────────── */
header{padding:calc(env(safe-area-inset-top) + 24px) 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:-.035em;margin:0;text-shadow:0 1px 0 rgba(255,255,255,.65)}
[data-theme="dark"] h1{text-shadow:0 0 28px rgba(156,140,255,.18)}
.head-acts{display:flex;gap:9px}
.round{
  width:42px;height:42px;border-radius:15px;border:none;cursor:pointer;color:var(--text-dim);
  background:linear-gradient(145deg,var(--surface-hi),var(--surface));box-shadow:var(--shadow-out-sm);
  font-size:16px;display:grid;place-items:center;font-family:inherit;transition:.18s ease;
}
.round:active{transform:translateY(2px) scale(.98);box-shadow:var(--shadow-in-sm)}
[data-theme="dark"] .round{backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);border:1px solid rgba(255,255,255,.06)}

/* ── progress hero: big tactile module ───────────────── */
.hero{
  background:linear-gradient(145deg,var(--surface-hi),var(--surface));border-radius:32px;
  box-shadow:var(--shadow-out);padding:24px 22px 22px;margin:15px 0 20px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-62px;top:-98px;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.82),rgba(255,255,255,0) 68%);opacity:.78;pointer-events:none;
}
.hero::after{
  content:"";position:absolute;left:20px;right:20px;bottom:11px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);opacity:.72;
}
[data-theme="dark"] .hero{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%)}
[data-theme="dark"] .hero::before{background:radial-gradient(circle,rgba(156,140,255,.26),transparent 68%)}
.hero-row{display:flex;align-items:center;gap:20px;position:relative;z-index:1}
.ring{width:92px;height:92px;flex:none;position:relative;display:grid;place-items:center;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-in)}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.55);pointer-events:none}
.ring svg{position:absolute;inset:4px;transform:rotate(-90deg);filter:drop-shadow(0 3px 5px rgba(91,72,150,.18))}
.ring svg circle{stroke-width:8}
.ring-num{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:-.04em}
.hero-t{font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:5px}
.hero-x{font-size:13px;color:var(--text-dim)}
.hero-saved{font-size:11.5px;color:var(--text-faint);margin-top:9px;min-height:15px}

/* ── tabs: pressed track + floating buttons ───────────── */
.tabs{
  display:flex;gap:7px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-in);
  padding:6px;margin-bottom:19px;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;border:none;cursor:pointer;font-family:inherit;padding:10px 13px;border-radius:16px;
  background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:800;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s ease;
}
.tab.on{background:linear-gradient(145deg,var(--surface-hi),var(--surface));color:var(--text);box-shadow:var(--shadow-out-sm);transform:translateY(-1px)}
.tab i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--text-faint);padding:1px 6px;border-radius:99px;background:rgba(127,111,98,.06)}
.tab.on i{color:var(--accent);background:rgba(120,103,234,.10)}
[data-theme="dark"] .tabs{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-theme="dark"] .tab.on{background:rgba(255,255,255,.09);box-shadow:0 9px 22px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.10)}

/* ── groups / tasks ───────────────────────────────────── */
.group{margin-bottom:19px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 7px 9px}
.group-t{font-size:10.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)}
.group-n{font-size:11px;font-weight:700;color:var(--text-faint)}
.list{
  background:linear-gradient(145deg,var(--surface-hi),var(--surface));border-radius:25px;box-shadow:var(--shadow-out);
  padding:7px 6px;overflow:hidden;position:relative;
}
.list::after{content:"";position:absolute;inset:0;border-radius:25px;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.70)}
[data-theme="dark"] .list{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.055);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
[data-theme="dark"] .list::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.task{display:flex;align-items:flex-start;gap:13px;padding:13px 14px;cursor:pointer;border-radius:18px;position:relative;transition:.16s ease}
.task + .task::before{content:"";position:absolute;left:54px;right:14px;top:0;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.task:active{transform:scale(.995);background:rgba(120,103,234,.035)}
.box{
  width:26px;height:26px;flex:none;border-radius:9px;margin-top:0;background:var(--surface);
  box-shadow:var(--shadow-in-sm);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:900;
  transition:.18s cubic-bezier(.2,.8,.2,1);position:relative;
}
.box::after{content:"";position:absolute;inset:3px;border-radius:7px;border:1px solid rgba(255,255,255,.38);opacity:.55;pointer-events:none}
.task.done .box{background:linear-gradient(145deg,#8b7af3,#6e5adc);box-shadow:0 7px 16px rgba(98,82,200,.28),inset 0 1px 0 rgba(255,255,255,.45);color:#fff;transform:translateY(-1px)}
.task.done .box::after{display:none}
.task-t{font-size:14px;line-height:1.42;font-weight:600;letter-spacing:-.005em}
.task.done .task-t{color:var(--text-faint);text-decoration:line-through;text-decoration-thickness:1px}
.task-n{display:block;font-size:11.5px;color:var(--text-faint);margin-top:4px;text-decoration:none;line-height:1.45}
.task.done .task-n{opacity:.55}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;margin-right:7px;vertical-align:1px;background:var(--surface-lo);color:var(--text-faint);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tag.hot{background:rgba(220,130,97,.14);color:#b96144}
.tag.me{background:rgba(120,103,234,.13);color:var(--accent)}
[data-theme="dark"] .tag.hot{color:#ffac84}.tag.me{color:var(--accent)}
.del{margin-left:auto;flex:none;border:none;background:transparent;cursor:pointer;color:var(--text-faint);font-size:15px;padding:0 2px;font-family:inherit}

/* ── add task: concave input + candy button ───────────── */
.adder{display:flex;gap:10px;margin:14px 0 5px}
.adder input{
  flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:14px;padding:14px 17px;border-radius:18px;
  background:var(--surface);box-shadow:var(--shadow-in);color:var(--text);transition:.18s ease;
}
.adder input:focus{box-shadow:var(--shadow-in),0 0 0 2px rgba(120,103,234,.16)}
.adder button{
  flex:none;border:none;cursor:pointer;font-family:var(--disp);font-weight:900;font-size:20px;width:50px;border-radius:17px;
  background:linear-gradient(145deg,#8b7af3,#6d59dc);color:#fff;box-shadow:0 10px 20px rgba(96,79,200,.28),inset 1px 1px 0 rgba(255,255,255,.42),inset -1px -1px 0 rgba(70,48,160,.20);
  transition:.16s ease;
}
.adder button:active{transform:translateY(2px) scale(.97);box-shadow:0 5px 10px rgba(96,79,200,.22),inset 2px 2px 6px rgba(45,33,120,.18)}
.empty{padding:28px 16px;text-align:center;color:var(--text-faint);font-size:13px}
.foot{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:25px;letter-spacing:.03em}

/* ── PIN screen: tactile keypad / glass in dark ───────── */
.pin-screen{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  background:
    radial-gradient(700px 450px at 20% 0%,rgba(255,255,255,.88),transparent 60%),
    linear-gradient(145deg,var(--bg2),var(--bg));
}
[data-theme="dark"] .pin-screen{background:radial-gradient(650px 450px at 20% 0%,rgba(120,90,255,.20),transparent 60%),linear-gradient(180deg,#10121a,#08090d)}
.pin-screen.hidden{display:none}
.pin-logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,var(--surface-hi),var(--surface));box-shadow:var(--shadow-out);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:19px;transform:rotate(-2deg)}
.pin-title{font-size:13px;color:var(--text-dim);font-weight:700}
.pin-dots{display:flex;gap:12px;padding:10px 13px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow-in-sm)}
.pin-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-in-sm)}
.pin-dot.filled{background:linear-gradient(145deg,#8d7af4,#6d59dc);box-shadow:0 4px 8px rgba(100,80,200,.25)}
.pin-error{font-size:12.5px;color:var(--danger);min-height:18px;text-align:center;padding:0 24px}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:15px}
.pin-btn{width:72px;height:72px;border-radius:24px;border:none;cursor:pointer;background:linear-gradient(145deg,var(--surface-hi),var(--surface));box-shadow:var(--shadow-out);color:var(--text);font-family:var(--disp);font-weight:700;font-size:21px;transition:.16s ease}
.pin-btn:active{transform:translateY(3px) scale(.97);box-shadow:var(--shadow-in)}
.pin-btn.del{font-family:inherit;font-size:17px;color:var(--text-dim)}
[data-theme="dark"] .pin-logo,[data-theme="dark"] .pin-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* ── small-screen tuning ──────────────────────────────── */
@media (max-width:420px){
  .wrap{padding:0 13px}
  h1{font-size:21px}
  .hero{border-radius:28px;padding:21px 18px 19px}
  .ring{width:86px;height:86px}
  .list{border-radius:22px}
  .task{padding:12px 12px}
  .tab{padding:9px 11px;font-size:12px}
}


/* ═══ ДОПОЛНЕНИЯ К МАКЕТУ ════════════════════════════════════════════════════
   Макет рисовался поверх первой доски, где ещё не было плановых строк, выбора
   группы и переключателя «показать сделанное». Дописано в его же манере —
   тени и радиусы взяты из соседних правил, своих значений не выдумывал. */

/* ⚠️ ПОЛОМКА МАКЕТА: подложка кольца ссылается на `--surface2`, а такой
   переменной в нём не объявлено — дуга прогресса лежала бы на пустоте.
   Не переписываю разметку кольца, а объявляю переменную: так правка
   переживёт следующую присылку макета */
:root{ --surface2: var(--surface-lo); }
[data-theme="dark"]{ --surface2: var(--surface-lo); }

/* Плановая строка в разделе лекций — то, чего в базе ещё нет */
.tag.plan{background:rgba(104,187,166,.16);color:#3d8b76}
[data-theme="dark"] .tag.plan{color:var(--accent-2)}

/* Выбор группы под полем ввода: подсписки и новые потоки */
.adder select{
  flex:1;min-width:0;border:none;outline:none;font-family:inherit;font-size:13.5px;
  padding:13px 17px;border-radius:18px;color:var(--text-dim);
  background:var(--surface);box-shadow:var(--shadow-in);
  -webkit-appearance:none;appearance:none;transition:.18s ease;
}
.adder select:focus{box-shadow:var(--shadow-in),0 0 0 2px rgba(120,103,234,.16)}
.adder select:disabled{opacity:.5}

/* Переключатель «показать сделанное» внизу */
.linky{
  border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;
  color:var(--text-dim);padding:9px 16px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-out-sm);transition:.18s ease;
}
.linky:active{box-shadow:var(--shadow-in-sm);transform:translateY(1px)}
</style>
</head>
<body>


<div class="pin-screen" id="pin-screen">
  <div class="pin-logo">БП</div>
  <div class="pin-title">Введите пин-код</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinKey('1')">1</button>
    <button class="pin-btn" onclick="pinKey('2')">2</button>
    <button class="pin-btn" onclick="pinKey('3')">3</button>
    <button class="pin-btn" onclick="pinKey('4')">4</button>
    <button class="pin-btn" onclick="pinKey('5')">5</button>
    <button class="pin-btn" onclick="pinKey('6')">6</button>
    <button class="pin-btn" onclick="pinKey('7')">7</button>
    <button class="pin-btn" onclick="pinKey('8')">8</button>
    <button class="pin-btn" onclick="pinKey('9')">9</button>
    <button class="pin-btn del" onclick="pinKey('del')">⌫</button>
    <button class="pin-btn" onclick="pinKey('0')">0</button>
    <button class="pin-btn del" onclick="pinKey('clear')">C</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>Задачи клуба</h1>
    <div class="head-acts">
      <button class="round" onclick="dropAllDone()" title="Убрать закрытые">✕</button>
      <button class="round" onclick="toggleTheme()" title="Тема">◐</button>
      <button class="round" onclick="location.href='./'" title="К дашборду">←</button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-row">
      <div class="ring">
        <svg viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface2)" stroke-width="9"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="9"
                  stroke-linecap="round" id="ring-arc" stroke-dasharray="0 999"/>
        </svg>
        <div class="ring-num" id="ring-num">0%</div>
      </div>
      <div style="min-width:0">
        <div class="hero-t" id="hero-t">Считаю…</div>
        <div class="hero-x" id="hero-x"></div>
        <div class="hero-saved" id="hero-saved"></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="body"></div>

  <div class="adder">
    <input id="new-task" placeholder="Своя задача в этот раздел…"
           onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">+</button>
  </div>
  <div class="adder"><select id="new-group"></select></div>

  <div class="foot"><button class="linky" id="show-done" onclick="toggleDone()">Показать сделанное</button>
    <div style="margin-top:11px">доска задач · <span id="build">tasks-v5</span></div></div>
</div>

<script>
const API = 'https://api.youselllikeagod-magazine.ru';
const ADMIN_TOKEN_KEY = 'admin_token';
const DOC_KEY = 'tasks';
let ADMIN_TOKEN = '';
try { ADMIN_TOKEN = sessionStorage.getItem(ADMIN_TOKEN_KEY) || ''; } catch(e) {}

/* ═══ ЗАДАЧИ ЖИВУТ НА СЕРВЕРЕ ═════════════════════════════════════════════════
   ⚠️ РАНЬШЕ ТЕКСТЫ БЫЛИ ЗАШИТЫ В ЭТОТ ФАЙЛ, а на сервере лежали только
   отметки. Тогда «добавить задачу» означало перевыложить страницу. Теперь весь
   список — документ `tasks` в админском хранилище: правится и отсюда, и одной
   командой из терминала.

   Документ: { v:2, sections:[{key,title}], items:[{id,sec,g,t,n,tag,done}] }
   `done` — дата строкой или пусто. Группы берутся ИЗ ПОРЯДКА `items`: первая
   встреченная группа идёт первой. Так порядок задаётся заливкой, а не
   отдельным полем, которое пришлось бы держать в согласии со списком.

   ⚠️ ПИШЕМ ТОЛЬКО ПАТЧАМИ, НЕ ДОКУМЕНТОМ ЦЕЛИКОМ: доску правят с двух сторон,
   и вкладка, открытая со вчера, не должна затирать добавленное мимо неё. */
const FALLBACK_SECTIONS = [
  { key:'dev',  title:'Разработка'   },
  { key:'test', title:'Тестирование' },
  { key:'fill', title:'Наполнение'   },
  { key:'ask',  title:'Решить'       }
];
let SECTIONS = FALLBACK_SECTIONS.slice();
let ITEMS = [];
/* ⚠️ РАЗДЕЛ ЛЕКЦИЙ НЕ ХРАНИТСЯ НА ДОСКЕ — он считается сервером из самой базы
   лекций. Иначе новая лекция не появлялась бы, пока её не занесут руками, а
   заполненное поле не убирало бы строку «нет таймкодов». На доске живёт только
   галочка «эту я доделал», задача заводится в момент первого нажатия */
const LEC_SEC = 'lec';
let LECTURES = [];
let CHECKS = {};
let cur = 'dev';
let showDone = false;
let saveTimer = null;
let pending = { add:[], remove:[], done:[], undone:[] };

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function sectionItems(sec){
  /* Группы — в порядке первого появления в `items`. Пустые (когда всё в них
     закрыто, а закрытое спрятано) не рисуем вовсе */
  const out = [];
  const byName = {};
  allItems(sec).forEach(function(it){
    if (it.done && !showDone) return;
    const g = it.g || 'Разное';
    if (!byName[g]){ byName[g] = { g:g, items:[] }; out.push(byName[g]); }
    byName[g].items.push(it);
  });
  return out;
}
function allItems(sec){
  /* ⚠️ В РАЗДЕЛЕ ЛЕКЦИЙ ДВА РОДА СТРОК. Из базы приходит то, что уже записано;
     свои строки — это ПЛАН на потоки, которых ещё нет. Сервер про них знать не
     может, а планировать наперёд надо. Плановые идут ПОСЛЕ настоящих внутри
     своей группы, чтобы записанное было видно первым */
  const own = ITEMS.filter(function(i){ return i.sec === sec; });
  if (sec !== LEC_SEC) return own;
  const real = lectureRows();
  const seen = {};
  real.forEach(function(r){ seen[r.id] = true; });
  return real.concat(own.filter(function(i){ return !seen[i.id]; }));
}
function tabs(){
  const t = SECTIONS.slice();
  if (LECTURES.length) t.push({ key:LEC_SEC, title:'Лекции' });
  return t;
}
/* Строка лекции — это её готовность ИЗ БАЗЫ плюс отметка С ДОСКИ, если она
   уже ставилась. Ключ задачи привязан к слагу, поэтому переименование лекции
   отметку не теряет */
function lectureRows(){
  return LECTURES.map(function(l){
    const id = 'lec:' + l.slug;
    const saved = ITEMS.filter(function(i){ return i.id === id; })[0];
    const miss = (l.missing || []).map(function(k){ return CHECKS[k] || k; });
    return { id:id, sec:LEC_SEC, g:l.group || 'Вне потоков', t:l.title,
             n: miss.length ? 'нет: ' + miss.join(', ') : 'всё на месте',
             done: saved ? saved.done : '', lecture:true };
  });
}
function doneCount(list){ return list.filter(function(i){ return !!i.done; }).length; }
function findItem(id){
  for (let i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
  return null;
}

function render(){
  document.getElementById('tabs').innerHTML = tabs().map(function(s){
    const list = allItems(s.key);
    return '<button class="tab' + (s.key===cur ? ' on' : '') + '" onclick="switchTab(\'' + s.key + '\')">'
      + esc(s.title) + '<i>' + doneCount(list) + '/' + list.length + '</i></button>';
  }).join('');

  const groups = sectionItems(cur);
  let h = '';
  groups.forEach(function(g){
    const total = allItems(cur).filter(function(i){ return (i.g || 'Разное') === g.g; });
    h += '<div class="group"><div class="group-head">'
       + '<div class="group-t">' + esc(g.g) + '</div>'
       + '<div class="group-n">' + doneCount(total) + ' из ' + total.length + '</div></div><div class="list">';
    g.items.forEach(function(it){
      h += '<div class="task' + (it.done ? ' done' : '') + '" onclick="toggle(\'' + esc(it.id) + '\')">'
         + '<div class="box">✓</div><div style="min-width:0"><div class="task-t">'
         + (it.tag === 'hot' ? '<span class="tag hot">срочное</span>' : '')
         + (it.tag === 'me'  ? '<span class="tag me">за мной</span>'  : '')
         + (it.tag === 'plan' ? '<span class="tag plan">план</span>'  : '')
         + esc(it.t) + '</div>'
         + (it.n ? '<span class="task-n">' + esc(it.n) + '</span>' : '')
         + '</div>'
         + (it.lecture ? ''
            : '<button class="del" onclick="event.stopPropagation();dropTask(\'' + esc(it.id) + '\')">✕</button>')
         + '</div>';
    });
    h += '</div></div>';
  });
  if (!groups.length){
    h = '<div class="list"><div class="empty">'
      + (ITEMS.length ? 'Здесь всё закрыто' : 'Список пуст — залей задачи командой из чата')
      + '</div></div>';
  }
  document.getElementById('body').innerHTML = h;

  let all = 0, dn = 0;
  tabs().forEach(function(s){
    const list = allItems(s.key);
    all += list.length; dn += doneCount(list);
  });
  const pct = all ? Math.round(dn * 100 / all) : 0;
  const arc = document.getElementById('ring-arc');
  const len = 2 * Math.PI * 36;
  arc.setAttribute('stroke-dasharray', (len * pct / 100).toFixed(1) + ' ' + len.toFixed(1));
  document.getElementById('ring-num').textContent = pct + '%';
  document.getElementById('hero-t').textContent = heroTitle(pct);
  document.getElementById('hero-x').textContent = 'Закрыто ' + dn + ' из ' + all
    + ' · осталось ' + (all - dn);
  const sw = document.getElementById('show-done');
  if (sw) sw.textContent = showDone ? 'Скрыть сделанное' : 'Показать сделанное';
  const inp = document.getElementById('new-task');
  if (inp) inp.placeholder = (cur === LEC_SEC)
    ? 'Запланировать занятие — впишется в поток…'
    : 'Своя задача в этот раздел…';

  /* Список групп текущего раздела — берётся из ВСЕХ задач, не только видимых:
     иначе группа, где всё закрыто, пропадала бы из выбора */
  const sel = document.getElementById('new-group');
  if (sel){
    const seen = [];
    allItems(cur).forEach(function(i){
      const g = i.g || 'Мои';
      if (seen.indexOf(g) < 0) seen.push(g);
    });
    if (seen.indexOf('Мои') < 0) seen.push('Мои');
    const keep = sel.value;
    sel.innerHTML = seen.map(function(g){
      return '<option value="' + esc(g) + '">' + esc(g) + '</option>';
    }).join('') + '<option value="__new__">+ новая группа…</option>';
    if (seen.indexOf(keep) >= 0 || keep === '__new__') sel.value = keep;
    sel.disabled = false;
  }
}

function heroTitle(p){
  if (p === 0)   return 'Начинаем';
  if (p < 15)    return 'Первые сдвинулись';
  if (p < 35)    return 'Пошло дело';
  if (p < 55)    return 'Уже видно берег';
  if (p < 75)    return 'Больше половины позади';
  if (p < 95)    return 'Финальный бросок';
  if (p < 100)   return 'Почти всё';
  return 'Готово. Всё.';
}

function switchTab(k){ cur = k; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function toggleDone(){ showDone = !showDone; render(); }

function toggle(id){
  if (id.indexOf('lec:') === 0) return toggleLecture(id);
  const it = findItem(id);
  if (!it) return;
  if (it.done){ it.done = ''; markPending('undone', 'done', id); }
  else { it.done = new Date().toISOString().slice(0,10); markPending('done', 'undone', id); }
  render();
  save();
}

/* ⚠️ У ЛЕКЦИИ ЗАДАЧИ МОЖЕТ ЕЩЁ НЕ БЫТЬ. Первое нажатие её создаёт и сразу
   отмечает — двумя действиями в одном патче, иначе `done` не к чему прицепить */
function toggleLecture(id){
  const row = lectureRows().filter(function(r){ return r.id === id; })[0];
  if (!row) return;
  const saved = findItem(id);
  if (saved && saved.done){
    saved.done = '';
    markPending('undone', 'done', id);
  } else if (saved){
    saved.done = new Date().toISOString().slice(0,10);
    markPending('done', 'undone', id);
  } else {
    const it = { id:id, sec:LEC_SEC, g:row.g, t:row.t,
                 done:new Date().toISOString().slice(0,10) };
    ITEMS.push(it);
    pending.add.push(it);
  }
  render();
  save();
}

function addTask(){
  const inp = document.getElementById('new-task');
  const text = (inp.value || '').trim();
  if (!text) return;
  /* Группа: выбранная в списке, либо своя по кнопке «новая». Так и получаются
     подсписки — «Поток про возражения» и что угодно ещё */
  let g = document.getElementById('new-group').value || 'Мои';
  if (g === '__new__'){
    g = (prompt('Название новой группы:') || '').trim();
    if (!g) return;
  }
  const it = { id:'x' + Date.now().toString(36), sec:cur, g:g, t:text, done:'' };
  // В разделе лекций своя строка — это план: метка отличает её от записанного
  if (cur === LEC_SEC) it.tag = 'plan';
  ITEMS.push(it);
  pending.add.push(it);
  inp.value = '';
  render();
  save();
}

function dropTask(id){
  const it = findItem(id);
  if (!it) return;
  if (!confirm('Убрать задачу «' + it.t + '» насовсем?')) return;
  ITEMS = ITEMS.filter(function(i){ return i.id !== id; });
  dropPending(id);
  render();
  save();
}

function dropAllDone(){
  const n = ITEMS.filter(function(i){ return !!i.done; }).length;
  if (!n) return;
  if (!confirm('Убрать все закрытые задачи (' + n + ') насовсем?')) return;
  ITEMS.filter(function(i){ return !!i.done; }).forEach(function(i){ dropPending(i.id); });
  ITEMS = ITEMS.filter(function(i){ return !i.done; });
  render();
  save();
}

/* ⚠️ КОПИМ ПРАВКИ И ШЛЁМ ПАЧКОЙ. Отметить десять задач подряд — обычное дело,
   и десять запросов ни к чему; при уходе со страницы пачка дожимается */
/* ⚠️ ОДНА ЗАДАЧА — ОДНО РЕШЕНИЕ В ПАЧКЕ. Поймано на стенде: отметил, снял,
   снова отметил — и в патче ехали и `done`, и `undone` для того же ключа.
   Сервер применяет `undone` последним, так что на экране галочка стояла бы, а
   в базе снялась. Держим ПОСЛЕДНЕЕ действие: кладя ключ в один список, убираем
   его из противоположного */
function markPending(list, other, id){
  const i = pending[other].indexOf(id);
  if (i >= 0) pending[other].splice(i, 1);
  if (pending[list].indexOf(id) < 0) pending[list].push(id);
}
/* Задача, созданная и удалённая до отправки, на сервер не ездила вовсе —
   слать `remove` по ключу, которого там нет, незачем */
function dropPending(id){
  const i = pending.add.map(function(x){ return x.id; }).indexOf(id);
  markPending('remove', 'add', id);
  if (i >= 0){
    pending.add.splice(i, 1);
    const j = pending.remove.indexOf(id);
    if (j >= 0) pending.remove.splice(j, 1);
  }
  ['done','undone'].forEach(function(k){
    const j = pending[k].indexOf(id);
    if (j >= 0) pending[k].splice(j, 1);
  });
}

function save(){
  clearTimeout(saveTimer);
  setSaved('сохраняю…');
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow(){
  clearTimeout(saveTimer);
  saveTimer = null;
  const batch = pending;
  if (!batch.add.length && !batch.remove.length && !batch.done.length && !batch.undone.length) return;
  pending = { add:[], remove:[], done:[], undone:[] };
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '/patch?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(batch)
    });
    if (!r.ok) throw new Error('код ' + r.status);
    setSaved('сохранено ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}));
  } catch (e) {
    /* ⚠️ ВОЗВРАЩАЕМ ПАЧКУ В ОЧЕРЕДЬ, а не теряем: следующая правка увезёт её
       вместе со своей. Иначе отметка выглядела бы поставленной на экране и
       пропадала при перезагрузке */
    pending.add = batch.add.concat(pending.add);
    pending.remove = batch.remove.concat(pending.remove);
    pending.done = batch.done.concat(pending.done);
    pending.undone = batch.undone.concat(pending.undone);
    setSaved('не сохранилось (' + e.message + ') — попробую с следующей правкой');
  }
}
function setSaved(s){ const el = document.getElementById('hero-saved'); if (el) el.textContent = s; }

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') saveNow();
});

/* ⚠️ ОТКАЗ ПО ЛЕКЦИЯМ НЕ ДОЛЖЕН РОНЯТЬ ДОСКУ: раздел просто не появится,
   остальные четыре работают как работали */
async function loadLectures(){
  try {
    const r = await fetch(API + '/admin/lectures/readiness?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN));
    if (!r.ok) throw new Error('код ' + r.status);
    const d = await r.json();
    LECTURES = Array.isArray(d.items) ? d.items.filter(function(l){ return l && l.slug; }) : [];
    CHECKS = {};
    (d.checks || []).forEach(function(c){ if (c && c.key) CHECKS[c.key] = c.label; });
  } catch (e) {
    LECTURES = [];
  }
}

async function loadAll(){
  document.getElementById('app').style.display = '';
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN));
    if (!r.ok) throw new Error('код ' + r.status);
    const d = await r.json();
    const data = d.data || {};
    /* Что пришло — проверяем: пустой или битый документ не должен ронять
       страницу, доска обязана открываться и когда сохранять ещё нечего */
    ITEMS = Array.isArray(data.items)
      ? data.items.filter(function(i){ return i && i.id && i.t; })
      : [];
    SECTIONS = (Array.isArray(data.sections) && data.sections.length)
      ? data.sections.filter(function(s){ return s && s.key && s.title; })
      : FALLBACK_SECTIONS.slice();
    if (!SECTIONS.some(function(s){ return s.key === cur; }) && SECTIONS.length) cur = SECTIONS[0].key;
    await loadLectures();
    setSaved(d.updated_at ? 'последняя правка: ' + new Date(d.updated_at).toLocaleString('ru-RU',
      {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '');
  } catch (e) {
    setSaved('не удалось прочитать список (' + e.message + ')');
  }
  render();
}

function toggleTheme(){
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', html.dataset.theme); } catch(e) {}
}
(function(){
  let saved = 'light';
  try { saved = localStorage.getItem('theme') || 'light'; } catch(e) {}
  document.documentElement.dataset.theme = saved;
})();

/* ═══ ПИН ═════════════════════════════════════════════════════════════════════
   Тот же механизм, что в дашборде: пин уходит на сервер, обратно приходит ключ
   на 12 часов. ⚠️ Ключ лежит в sessionStorage, а он у каждой вкладки свой —
   значит вход сюда отдельный от дашборда, это нормально, а не поломка */
const PIN_LENGTH = 5;
let pinEntered = '';
let pinBusy = false;

async function submitPin(){
  const err = document.getElementById('pin-error');
  pinBusy = true;
  try {
    const r = await fetch(API + '/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pin: pinEntered })
    });
    const data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.detail || 'Не получилось войти');
    ADMIN_TOKEN = data.token;
    try { sessionStorage.setItem(ADMIN_TOKEN_KEY, data.token); } catch(e) {}
    err.textContent = '';
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  } catch (e) {
    err.textContent = e.message;
  } finally {
    pinBusy = false;
    pinEntered = '';
    for (let i = 0; i < PIN_LENGTH; i++){
      const d = document.getElementById('d'+i);
      if (d) d.classList.remove('filled');
    }
  }
}
function pinKey(k){
  const err = document.getElementById('pin-error');
  err.textContent = '';
  if (k === 'del') pinEntered = pinEntered.slice(0,-1);
  else if (k === 'clear') pinEntered = '';
  else if (pinEntered.length < PIN_LENGTH && !pinBusy) pinEntered += k;
  for (let i = 0; i < PIN_LENGTH; i++){
    document.getElementById('d'+i).classList.toggle('filled', i < pinEntered.length);
  }
  if (pinEntered.length === PIN_LENGTH) submitPin();
}
document.addEventListener('keydown', function(e){
  if (document.getElementById('pin-screen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('del');
  else if (e.key === 'Escape') pinKey('clear');
});
(function(){
  if (ADMIN_TOKEN){
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  }
})();
</script>
