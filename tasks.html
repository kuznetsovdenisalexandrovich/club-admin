<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи клуба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;500;600;700;800&display=swap');

/* ⚠️ ТОКЕНЫ ВЗЯТЫ ИЗ ДАШБОРДА ОДИН В ОДИН — страница живёт в том же
   репозитории и должна выглядеть его частью, а не соседним сайтом */
:root{
  --bg:#e2dbd2; --bg-c:#ede6de;
  --surface:#e2dbd2; --surface2:#ddd6cc;
  --line:rgba(100,80,60,0.09);
  --text:#3a3028; --text-dim:#7a6a60; --text-faint:#a89888;
  --sh-r: 6px 6px 16px #c2bab0, -6px -6px 16px #faf4ec;
  --sh-sm: 3px 3px 9px #c2bab0, -3px -3px 9px #faf4ec;
  --sh-i: inset 5px 5px 12px #c2bab0, inset -5px -5px 12px #faf4ec;
  --sh-is: inset 3px 3px 7px #c2bab0, inset -3px -3px 7px #faf4ec;
  --accent:#7b61ff; --accent-2:#59c2a8; --warm:#d98b4a;
  --disp:'Unbounded', system-ui, sans-serif;
}
[data-theme="dark"]{
  --bg:#0c0a15; --bg-c:#110f1e;
  --surface:rgba(255,255,255,0.05); --surface2:rgba(255,255,255,0.09);
  --line:rgba(255,255,255,0.07);
  --text:#f0eefc; --text-dim:#a29dc2; --text-faint:#655f80;
  --sh-r:0 10px 30px -12px rgba(0,0,0,.6);
  --sh-sm:0 6px 18px -10px rgba(0,0,0,.5);
  --sh-i:inset 0 1px 0 rgba(255,255,255,.05);
  --sh-is:inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.45;
  padding:0 0 calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── Шапка ── */
header{padding:calc(env(safe-area-inset-top) + 22px) 0 6px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--disp);font-weight:900;font-size:23px;letter-spacing:-.02em;margin:0}
.head-acts{display:flex;gap:8px}
.round{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:var(--surface);color:var(--text-dim);box-shadow:var(--sh-sm);
  font-size:15px;display:grid;place-items:center;font-family:inherit}
.round:active{box-shadow:var(--sh-is)}

/* ── Общий прогресс ── */
.hero{background:var(--surface);border-radius:24px;box-shadow:var(--sh-r);
  padding:20px 20px 18px;margin:14px 0 16px;position:relative;overflow:hidden}
.hero-row{display:flex;align-items:center;gap:18px}
.ring{width:84px;height:84px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-num{font-family:var(--disp);font-weight:900;font-size:21px;letter-spacing:-.03em}
.hero-t{font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:5px}
.hero-x{font-size:13px;color:var(--text-dim)}
.hero-saved{font-size:11.5px;color:var(--text-faint);margin-top:9px;min-height:15px}

/* ── Вкладки ── */
.tabs{display:flex;gap:6px;background:var(--surface);border-radius:999px;
  box-shadow:var(--sh-is);padding:5px;margin-bottom:16px;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:none;cursor:pointer;font-family:inherit;
  padding:9px 14px;border-radius:999px;background:transparent;color:var(--text-dim);
  font-size:13px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.tab i{font-style:normal;font-size:11px;font-weight:800;color:var(--text-faint)}
.tab.on i{color:var(--accent)}

/* ── Группы и задачи ── */
.group{margin-bottom:16px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin:0 4px 8px}
.group-t{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint)}
.group-n{font-size:11px;font-weight:700;color:var(--text-faint)}
.list{background:var(--surface);border-radius:20px;box-shadow:var(--sh-r);
  padding:6px 4px;overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;cursor:pointer;
  border-radius:16px;position:relative}
.task + .task::before{content:"";position:absolute;left:48px;right:14px;top:0;
  height:1px;background:var(--line)}
.task:active{background:var(--surface2)}
.box{width:23px;height:23px;flex:none;border-radius:8px;margin-top:1px;
  background:var(--surface);box-shadow:var(--sh-is);display:grid;place-items:center;
  color:transparent;font-size:13px;font-weight:800;transition:color .15s ease}
.task.done .box{background:var(--accent);box-shadow:none;color:#fff}
.task-t{font-size:14px;line-height:1.4}
.task.done .task-t{color:var(--text-faint);text-decoration:line-through}
.task-n{display:block;font-size:11.5px;color:var(--text-faint);margin-top:3px;
  text-decoration:none}
.task.done .task-n{opacity:.6}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:6px;
  vertical-align:1px;background:var(--surface2);color:var(--text-faint)}
.tag.hot{background:rgba(217,139,74,.16);color:var(--warm)}
.tag.me{background:rgba(123,97,255,.14);color:var(--accent)}
.del{margin-left:auto;flex:none;border:none;background:transparent;cursor:pointer;
  color:var(--text-faint);font-size:15px;padding:0 2px;font-family:inherit}

/* ── Добавление своей задачи ── */
.adder{display:flex;gap:8px;margin:12px 0 4px}
.adder input{flex:1;min-width:0;border:none;outline:none;font-family:inherit;
  font-size:14px;padding:13px 16px;border-radius:16px;
  background:var(--surface);box-shadow:var(--sh-is);color:var(--text)}
.adder button{flex:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;
  font-size:14px;padding:0 18px;border-radius:16px;background:var(--accent);color:#fff;
  box-shadow:var(--sh-sm)}
.adder button:active{transform:scale(.97)}

.empty{padding:26px 16px;text-align:center;color:var(--text-faint);font-size:13px}
.foot{text-align:center;font-size:11px;color:var(--text-faint);margin-top:22px}

/* ── PIN ── */
.pin-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:22px}
.pin-screen.hidden{display:none}
.pin-logo{width:64px;height:64px;border-radius:50%;background:var(--surface);
  box-shadow:var(--sh-r);display:grid;place-items:center;font-family:var(--disp);
  font-weight:900;font-size:20px}
.pin-title{font-size:14px;color:var(--text-dim)}
.pin-dots{display:flex;gap:12px}
.pin-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);
  box-shadow:var(--sh-is)}
.pin-dot.filled{background:var(--accent);box-shadow:none}
.pin-error{font-size:12.5px;color:#d9534f;min-height:18px;text-align:center;padding:0 24px}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pin-btn{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
  background:var(--surface);box-shadow:var(--sh-r);color:var(--text);
  font-family:var(--disp);font-weight:700;font-size:22px}
.pin-btn:active{box-shadow:var(--sh-is)}
.pin-btn.del{font-family:inherit;font-size:17px;color:var(--text-dim)}
</style>
</head>
<body>

<div class="pin-screen" id="pin-screen">
  <div class="pin-logo">БП</div>
  <div class="pin-title">Введите пин-код</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinKey('1')">1</button>
    <button class="pin-btn" onclick="pinKey('2')">2</button>
    <button class="pin-btn" onclick="pinKey('3')">3</button>
    <button class="pin-btn" onclick="pinKey('4')">4</button>
    <button class="pin-btn" onclick="pinKey('5')">5</button>
    <button class="pin-btn" onclick="pinKey('6')">6</button>
    <button class="pin-btn" onclick="pinKey('7')">7</button>
    <button class="pin-btn" onclick="pinKey('8')">8</button>
    <button class="pin-btn" onclick="pinKey('9')">9</button>
    <button class="pin-btn del" onclick="pinKey('del')">⌫</button>
    <button class="pin-btn" onclick="pinKey('0')">0</button>
    <button class="pin-btn del" onclick="pinKey('clear')">C</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>Задачи клуба</h1>
    <div class="head-acts">
      <button class="round" onclick="toggleTheme()" title="Тема">◐</button>
      <button class="round" onclick="location.href='./'" title="К дашборду">←</button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-row">
      <div class="ring">
        <svg viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface2)" stroke-width="9"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="9"
                  stroke-linecap="round" id="ring-arc" stroke-dasharray="0 999"/>
        </svg>
        <div class="ring-num" id="ring-num">0%</div>
      </div>
      <div style="min-width:0">
        <div class="hero-t" id="hero-t">Считаю…</div>
        <div class="hero-x" id="hero-x"></div>
        <div class="hero-saved" id="hero-saved"></div>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="body"></div>

  <div class="adder">
    <input id="new-task" placeholder="Своя задача в этот раздел…"
           onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">+</button>
  </div>

  <div class="foot">доска задач · <span id="build">tasks-v1</span></div>
</div>

<script>

/* ═══ СОСТОЯНИЕ ══════════════════════════════════════════════════════════════
   Документ на сервере: { done:{id:"дата"}, custom:[{id,t,sec}] }.
   ⚠️ ДЕРЖИМ ЕГО ЦЕЛИКОМ И ШЛЁМ ЦЕЛИКОМ — сервер не сливает по ключам, иначе
   удалённая своя задача воскресала бы при следующем сохранении.            */
let DOC = { done:{}, custom:[] };
let cur = 'dev';
let saveTimer = null;

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function sectionItems(sec){
  /* Свои задачи идут отдельной группой в конце — так видно, что добавлено
     руками, и они не путаются с моим списком */
  const groups = (TASKS[sec] || []).map(function(g){
    return { g:g.g, items:g.items.slice() };
  });
  const mine = DOC.custom.filter(function(c){ return c.sec === sec; });
  if (mine.length) groups.push({ g:'Мои', items:mine.map(function(c){
    return { id:c.id, t:c.t, own:true };
  })});
  return groups;
}
function allItems(sec){
  return sectionItems(sec).reduce(function(a,g){ return a.concat(g.items); }, []);
}
function doneCount(list){
  return list.filter(function(i){ return !!DOC.done[i.id]; }).length;
}

function render(){
  // вкладки
  document.getElementById('tabs').innerHTML = SECTIONS.map(function(s){
    const list = allItems(s.key);
    return '<button class="tab' + (s.key===cur ? ' on' : '') + '" onclick="switchTab(\'' + s.key + '\')">'
      + esc(s.title) + '<i>' + doneCount(list) + '/' + list.length + '</i></button>';
  }).join('');

  // тело
  const groups = sectionItems(cur);
  let h = '';
  groups.forEach(function(g){
    const dn = doneCount(g.items);
    h += '<div class="group"><div class="group-head">'
       + '<div class="group-t">' + esc(g.g) + '</div>'
       + '<div class="group-n">' + dn + ' из ' + g.items.length + '</div></div><div class="list">';
    g.items.forEach(function(it){
      const done = !!DOC.done[it.id];
      h += '<div class="task' + (done ? ' done' : '') + '" onclick="toggle(\'' + it.id + '\')">'
         + '<div class="box">✓</div><div style="min-width:0"><div class="task-t">'
         + (it.tag === 'hot' ? '<span class="tag hot">срочное</span>' : '')
         + (it.tag === 'me'  ? '<span class="tag me">за мной</span>'  : '')
         + esc(it.t) + '</div>'
         + (it.n ? '<span class="task-n">' + esc(it.n) + '</span>' : '')
         + '</div>'
         + (it.own ? '<button class="del" onclick="event.stopPropagation();dropTask(\'' + it.id + '\')">✕</button>' : '')
         + '</div>';
    });
    h += '</div></div>';
  });
  if (!groups.length) h = '<div class="list"><div class="empty">Пусто</div></div>';
  document.getElementById('body').innerHTML = h;

  // кольцо: считаем ПО ВСЕМ разделам, это и есть общий прогресс проекта
  let all = 0, dn = 0;
  SECTIONS.forEach(function(s){
    const list = allItems(s.key);
    all += list.length; dn += doneCount(list);
  });
  const pct = all ? Math.round(dn * 100 / all) : 0;
  const arc = document.getElementById('ring-arc');
  const len = 2 * Math.PI * 36;
  arc.setAttribute('stroke-dasharray', (len * pct / 100).toFixed(1) + ' ' + len.toFixed(1));
  document.getElementById('ring-num').textContent = pct + '%';
  document.getElementById('hero-t').textContent = heroTitle(pct);
  document.getElementById('hero-x').textContent = 'Закрыто ' + dn + ' из ' + all
    + ' · осталось ' + (all - dn);
}

function heroTitle(p){
  if (p === 0)   return 'Начинаем';
  if (p < 15)    return 'Первые сдвинулись';
  if (p < 35)    return 'Пошло дело';
  if (p < 55)    return 'Уже видно берег';
  if (p < 75)    return 'Больше половины позади';
  if (p < 95)    return 'Финальный бросок';
  if (p < 100)   return 'Почти всё';
  return 'Готово. Всё.';
}

function switchTab(k){ cur = k; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function toggle(id){
  if (DOC.done[id]) delete DOC.done[id];
  else DOC.done[id] = new Date().toISOString().slice(0,10);
  render();
  save();
}

function addTask(){
  const inp = document.getElementById('new-task');
  const text = (inp.value || '').trim();
  if (!text) return;
  /* Идентификатор из времени: свои задачи живут только в документе, столкнуться
     с моими ключами не могут — у тех формат другой */
  DOC.custom.push({ id:'x' + Date.now().toString(36), t:text, sec:cur });
  inp.value = '';
  render();
  save();
}

function dropTask(id){
  DOC.custom = DOC.custom.filter(function(c){ return c.id !== id; });
  delete DOC.done[id];
  render();
  save();
}

/* ⚠️ СОХРАНЯЕМ С ЗАДЕРЖКОЙ, НО ОБЯЗАТЕЛЬНО. Отметить десять задач подряд —
   обычное дело, и десять запросов тут ни к чему; при этом уход со страницы
   не должен терять последнюю отметку, поэтому на `visibilitychange` дожимаем */
function save(){
  clearTimeout(saveTimer);
  setSaved('сохраняю…');
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow(){
  clearTimeout(saveTimer);
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(DOC)
    });
    if (!r.ok) throw new Error('код ' + r.status);
    setSaved('сохранено ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}));
  } catch (e) {
    setSaved('не сохранилось (' + e.message + ') — отметки в этой вкладке целы');
  }
}
function setSaved(s){ const el = document.getElementById('hero-saved'); if (el) el.textContent = s; }

document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden' && saveTimer) saveNow();
});

async function loadAll(){
  document.getElementById('app').style.display = '';
  try {
    const r = await fetch(API + '/admin/doc/' + DOC_KEY + '?x_admin_token=' + encodeURIComponent(ADMIN_TOKEN));
    if (!r.ok) throw new Error('код ' + r.status);
    const d = await r.json();
    const data = d.data || {};
    /* ⚠️ ЧТО ПРИШЛО — ПРОВЕРЯЕМ. Пустой или битый документ не должен ронять
       страницу: доска обязана открываться даже когда сохранять ещё нечего */
    DOC = { done: (data.done && typeof data.done === 'object') ? data.done : {},
            custom: Array.isArray(data.custom) ? data.custom : [] };
    setSaved(d.updated_at ? 'последняя правка: ' + new Date(d.updated_at).toLocaleString('ru-RU',
      {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '');
  } catch (e) {
    setSaved('не удалось прочитать сохранённое (' + e.message + ')');
  }
  render();
}

function toggleTheme(){
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', html.dataset.theme); } catch(e) {}
}
(function(){
  let saved = 'light';
  try { saved = localStorage.getItem('theme') || 'light'; } catch(e) {}
  document.documentElement.dataset.theme = saved;
})();

/* ═══ ПИН ═════════════════════════════════════════════════════════════════════
   Тот же механизм, что в дашборде: пин уходит на сервер, обратно приходит ключ
   на 12 часов. ⚠️ Ключ лежит в sessionStorage, а он у каждой вкладки свой —
   значит вход сюда отдельный от дашборда, это нормально, а не поломка */
const PIN_LENGTH = 5;
let pinEntered = '';
let pinBusy = false;

async function submitPin(){
  const err = document.getElementById('pin-error');
  pinBusy = true;
  try {
    const r = await fetch(API + '/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pin: pinEntered })
    });
    const data = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(data.detail || 'Не получилось войти');
    ADMIN_TOKEN = data.token;
    try { sessionStorage.setItem(ADMIN_TOKEN_KEY, data.token); } catch(e) {}
    err.textContent = '';
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  } catch (e) {
    err.textContent = e.message;
  } finally {
    pinBusy = false;
    pinEntered = '';
    for (let i = 0; i < PIN_LENGTH; i++){
      const d = document.getElementById('d'+i);
      if (d) d.classList.remove('filled');
    }
  }
}
function pinKey(k){
  const err = document.getElementById('pin-error');
  err.textContent = '';
  if (k === 'del') pinEntered = pinEntered.slice(0,-1);
  else if (k === 'clear') pinEntered = '';
  else if (pinEntered.length < PIN_LENGTH && !pinBusy) pinEntered += k;
  for (let i = 0; i < PIN_LENGTH; i++){
    document.getElementById('d'+i).classList.toggle('filled', i < pinEntered.length);
  }
  if (pinEntered.length === PIN_LENGTH) submitPin();
}
document.addEventListener('keydown', function(e){
  if (document.getElementById('pin-screen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('del');
  else if (e.key === 'Escape') pinKey('clear');
});
(function(){
  if (ADMIN_TOKEN){
    document.getElementById('pin-screen').classList.add('hidden');
    loadAll();
  }
})();
</script>
</body>
</html>
