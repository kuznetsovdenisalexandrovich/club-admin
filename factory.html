<!DOCTYPE html>
<!-- FILE_VERSION: factory_page-v3 -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Контент-завод</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/factory-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/factory-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/factory-192.png">
<link rel="shortcut icon" href="icons/factory.ico">
<!-- ⚠️ apple-touch на подложке: iOS не умеет прозрачность и подставит чёрное -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/factory-apple-180.png">
<meta name="apple-mobile-web-app-title" content="Завод">
<meta name="theme-color" content="#211f1d">
<style>
/* ═══════════════════════════════════════════════════════════════════
   ОФОРМЛЕНИЕ СНЯТО С МАКЕТА `Контент-завод (без React)` ЗАМЕРАМИ.
   Отступы, радиусы, кегли, слои теней и размытий взяты из отрисованного
   макета браузером, а не подобраны на глаз. Имена переменных оставлены
   как в макете — чтобы следующая присылка ложилась без перевода.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --pageBg:#211f1d;
  --shaft:linear-gradient(118deg,rgba(255,232,199,0) 26%,rgba(255,229,190,.62) 38%,rgba(255,240,214,.30) 48%,rgba(255,229,190,0) 58%);
  --glowWarm:radial-gradient(closest-side,rgba(255,222,178,.42),rgba(255,222,178,0) 70%);
  --glowCool:radial-gradient(closest-side,rgba(214,205,255,.20),rgba(214,205,255,0) 70%);
  --leakCyan:radial-gradient(closest-side,rgba(112,196,214,.42),rgba(112,196,214,0) 72%);
  --leakViolet:radial-gradient(closest-side,rgba(126,110,226,.34),rgba(126,110,226,0) 74%);
  --leakWarm:radial-gradient(closest-side,rgba(255,236,206,.66),rgba(255,236,206,0) 72%);
  --panelLeakA:radial-gradient(closest-side,rgba(126,110,226,.62),rgba(126,110,226,0) 72%);
  --panelLeakB:radial-gradient(closest-side,rgba(112,196,214,.5),rgba(112,196,214,0) 74%);
  --winBg:linear-gradient(160deg,rgba(243,236,227,.94),rgba(233,223,210,.90));
  --cardBg:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));
  --panelBg:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.44));
  --mutedCardBg:rgba(232,224,212,.6);
  --colBg:rgba(224,212,196,.44);
  --sunkBg:rgba(236,228,216,.82);
  --inputBg:rgba(255,255,255,.9);
  --inputBd:rgba(255,255,255,.95);
  --cardBd:rgba(255,255,255,.85);
  --chipBg:rgba(255,255,255,.62);
  --hairline:rgba(255,255,255,.5);
  --ink:#211d16;--ink2:#3a3428;--muted:#9c9284;
  --btnBg:#17150f;--btnHover:#2c281d;--btnFg:#fff;
  --accent:#5a4bc4;--accentSoft:rgba(126,110,226,.14);
  --ok:#3f7a5e;--okSoft:rgba(74,135,104,.14);
  --warn:#a8493a;--warnSoft:rgba(180,82,63,.14);--warnBd:rgba(180,82,63,.45);
  --barBg:linear-gradient(180deg,#7e6ee2,rgba(126,110,226,.4));
  --barLow:rgba(160,148,132,.4);
  --progBg:linear-gradient(90deg,#7e6ee2,#70c4d6);
  --trackBg:rgba(180,166,148,.32);
  --markBg:linear-gradient(140deg,#ffd479,#ff8f6b);
  --shCard:0 6px 16px -8px rgba(94,74,52,.45);
  --shSoft:0 2px 10px rgba(120,98,70,.10);
  --shBtn:0 10px 26px -8px rgba(23,21,15,.72);
  --shPanel:0 40px 80px -24px rgba(70,52,30,.55);
  --shWin:0 50px 110px -30px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.18);
  --navOnBg:rgba(255,255,255,.72);--navOnBd:rgba(255,255,255,.85);
  --navOnSh:0 6px 16px -8px rgba(94,74,52,.5);
  --shGlow:0 2px 10px -2px rgba(126,110,226,.5);
  --shBar:0 4px 10px -4px rgba(126,110,226,.45);
  --shTag:none;
  --panelBlur:linear-gradient(165deg,rgba(248,242,234,.9),rgba(238,229,216,.86));
  --panelBd:rgba(255,255,255,.72);
  --safe-top:0px;
}
html[data-theme="dark"]{
  --pageBg:#020204;
  --shaft:linear-gradient(118deg,rgba(140,120,255,0) 24%,rgba(150,130,255,.16) 38%,rgba(120,225,240,.13) 49%,rgba(140,120,255,0) 60%);
  --glowWarm:radial-gradient(closest-side,rgba(124,107,255,.34),rgba(124,107,255,0) 70%);
  --glowCool:radial-gradient(closest-side,rgba(63,200,228,.26),rgba(63,200,228,0) 70%);
  --leakCyan:radial-gradient(closest-side,rgba(63,200,228,.55),rgba(63,200,228,0) 72%);
  --leakViolet:radial-gradient(closest-side,rgba(124,107,255,.6),rgba(124,107,255,0) 74%);
  --leakWarm:radial-gradient(closest-side,rgba(255,120,190,.3),rgba(255,120,190,0) 72%);
  --panelLeakA:radial-gradient(closest-side,rgba(140,120,255,.8),rgba(140,120,255,0) 72%);
  --panelLeakB:radial-gradient(closest-side,rgba(63,220,228,.62),rgba(63,220,228,0) 74%);
  --winBg:linear-gradient(160deg,rgba(13,14,22,.94),rgba(5,5,9,.96));
  --cardBg:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  --panelBg:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  --mutedCardBg:rgba(255,255,255,.02);
  --colBg:rgba(148,160,255,.03);
  --sunkBg:rgba(255,255,255,.04);
  --inputBg:rgba(255,255,255,.07);
  --inputBd:rgba(174,166,255,.34);
  --cardBd:rgba(255,255,255,.12);
  --chipBg:rgba(255,255,255,.075);
  --hairline:rgba(255,255,255,.09);
  --ink:#eef0ff;--ink2:#c8cdea;--muted:#7c83a6;
  --btnBg:linear-gradient(135deg,#7c6bff,#3fc8e4);--btnHover:linear-gradient(135deg,#8f80ff,#59d7f0);--btnFg:#08080f;
  --accent:#b3a8ff;--accentSoft:rgba(124,107,255,.2);
  --ok:#6fe3ac;--okSoft:rgba(111,227,172,.16);
  --warn:#ff9b85;--warnSoft:rgba(255,155,133,.16);--warnBd:rgba(255,155,133,.5);
  --barBg:linear-gradient(180deg,#8f80ff,rgba(63,200,228,.35));
  --barLow:rgba(255,255,255,.12);
  --progBg:linear-gradient(90deg,#7c6bff,#3fc8e4);
  --trackBg:rgba(255,255,255,.09);
  --markBg:linear-gradient(140deg,#7c6bff,#3fc8e4);
  --shCard:0 10px 26px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  --shSoft:0 2px 12px rgba(0,0,0,.5);
  --shBtn:0 14px 34px -8px rgba(124,107,255,.85),0 0 22px -4px rgba(63,200,228,.6);
  --shPanel:0 50px 90px -28px rgba(0,0,0,.9),0 0 60px -18px rgba(124,107,255,.45);
  --shWin:0 60px 130px -34px rgba(0,0,0,.95),0 0 0 1px rgba(148,160,255,.12);
  --navOnBg:rgba(124,107,255,.16);--navOnBd:rgba(174,166,255,.3);
  --navOnSh:0 0 24px -8px rgba(124,107,255,.7),inset 0 0 0 1px rgba(174,166,255,.14);
  --shGlow:0 0 18px -2px rgba(124,107,255,.85),0 0 44px -6px rgba(63,200,228,.55);
  --shBar:0 0 16px -3px rgba(124,107,255,.75);
  --shTag:0 0 14px -6px rgba(124,107,255,.9),inset 0 0 0 1px rgba(174,166,255,.16);
  --panelBlur:linear-gradient(165deg,rgba(18,19,30,.9),rgba(7,8,13,.93));
  --panelBd:rgba(174,166,255,.26);
}
*{box-sizing:border-box}
body{margin:0;background:var(--pageBg);font-family:Onest,'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,105,88,.35);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── подложка страницы и само окно ───────────────────────────────── */
.page{position:relative;min-height:100vh;padding:34px;background:var(--pageBg);overflow-x:auto}
.shaft{position:absolute;inset:0;pointer-events:none;background:var(--shaft)}
.leak{position:absolute;pointer-events:none}
#leak1{left:-18%;bottom:-34%;width:88%;height:96%;background:var(--glowWarm);filter:blur(30px)}
#leak2{right:-14%;top:-26%;width:74%;height:82%;background:var(--glowCool);filter:blur(34px)}
#leak3{left:38%;bottom:-46%;width:52%;height:70%;background:var(--glowCool);filter:blur(50px);transform:rotate(18deg) scaleX(1.5)}
#leak4{left:-6%;top:-14%;width:38%;height:44%;background:var(--glowWarm);filter:blur(44px);transform:scaleY(.6)}
#leak5{left:30%;top:-38%;width:64%;height:104%;background:var(--leakCyan);filter:blur(52px)}
#leak6{left:2%;top:-32%;width:54%;height:88%;background:var(--leakViolet);filter:blur(58px)}
#leak7{right:-12%;bottom:-32%;width:58%;height:82%;background:var(--leakWarm);filter:blur(48px)}
.frame{position:relative;min-width:1240px;border-radius:30px;overflow:hidden;border:1px solid var(--hairline);background:var(--winBg);box-shadow:var(--shWin)}
.grid{position:relative;display:grid;grid-template-columns:236px 1fr;min-height:840px}
.main{position:relative;min-width:0}

/* ── шапка ───────────────────────────────────────────────────────── */
.top{position:relative;display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--btnBg);display:grid;place-items:center;box-shadow:var(--shSoft);flex:none}
.brand .mark i{width:12px;height:12px;border-radius:4px;background:var(--markBg);transform:rotate(14deg);display:block}
.brand b{font:700 16px/1 Onest;color:var(--ink);letter-spacing:-.01em}
.brand span{display:none}
.search{flex:1;max-width:460px;padding:11px 16px;border-radius:14px;background:var(--chipBg);border:1px solid var(--cardBd);box-shadow:var(--shSoft);font:400 13.5px/1 Onest;color:var(--ink);outline:none}
.search::placeholder{color:var(--muted)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid var(--cardBd);border-radius:13px;background:var(--chipBg);font:600 13px/1 Onest;color:var(--ink2)}
.chip b{font:600 11px/1 Onest;color:var(--btnFg);background:var(--btnBg);padding:4px 7px;border-radius:6px;box-shadow:var(--shGlow)}
.iconbtn{width:38px;height:38px;border:1px solid var(--cardBd);border-radius:13px;background:var(--chipBg);color:var(--ink2);font:600 14px/1 Onest;flex:none}
.primary{padding:10px 18px;border-radius:13px;background:var(--btnBg);color:var(--btnFg);font:600 13px/1 Onest;box-shadow:var(--shBtn)}
.ghost{padding:9px 15px;border:1px solid var(--inputBg);border-radius:12px;background:var(--cardBd);font:600 12.5px/1 Onest;color:var(--ink2)}

/* ── рельс ───────────────────────────────────────────────────────── */
.rail{padding:20px 16px;border-right:1px solid var(--hairline);display:flex;flex-direction:column;gap:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid transparent;border-radius:13px;background:transparent;font:500 13.5px/1 Onest;color:var(--muted);text-align:left}
.nav button.on{border-color:var(--navOnBd);background:var(--navOnBg);box-shadow:var(--navOnSh);font-weight:600;color:var(--ink)}
.nav .n{font:500 12px/1 Onest;opacity:.6}
.norm{padding:16px;border-radius:20px;background:var(--panelBg);border:1px solid var(--cardBd);box-shadow:var(--shCard)}
.norm h3{font:500 12px/1 Onest;color:var(--muted)}
.norm .big{margin-top:11px;font:700 32px/1 Onest;color:var(--ink);letter-spacing:-.02em}
.norm .big small{font:500 14px/1 Onest;color:var(--muted);margin-left:6px}
.track{margin-top:12px;height:8px;border-radius:6px;background:var(--trackBg);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--progBg);box-shadow:var(--shGlow)}
.railnote{font:400 12px/1.5 Onest;color:var(--muted);padding:0 4px}
.railnote b{color:var(--warn);font-weight:600}

/* ── полотно ─────────────────────────────────────────────────────── */
.pane{display:none}
.pane.on{display:block}
.head{display:flex;align-items:flex-end;gap:14px;padding:20px 24px 16px}
.head h1{font:700 22px/1.2 Onest;color:var(--ink);letter-spacing:-.02em}
.head .sub{margin-top:4px;font:400 13px/1 Onest;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(216px,1fr));gap:14px;align-items:start;padding:0 24px 28px}
.col{background:var(--colBg);border:1px solid var(--hairline);border-radius:22px;padding:12px 12px 14px}
.col.over{outline:1.5px dashed var(--accent);outline-offset:-4px}
.colhead{display:flex;justify-content:space-between;padding:2px 6px 11px;font:600 13px/1 Onest;color:var(--ink2)}
.colhead span{color:var(--muted);font-weight:500}
.card{background:var(--cardBg);border:1px solid var(--cardBd);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shCard);cursor:grab}
.card:last-child{margin-bottom:0}
.card.dragging{opacity:.45}
.card.flag{border-color:var(--warnBd)}
.card .t{font:600 13.5px/1.35 Onest;color:var(--ink);text-wrap:pretty}
.card .ins{margin-top:7px;font:500 12px/1.4 Onest;color:var(--ink2);border-left:2px solid var(--accentSoft);padding-left:9px}
.card .src{margin-top:7px;font:400 11.5px/1.4 Onest;color:var(--muted)}
.row{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font:500 11px/1 Onest;padding:5px 9px;border-radius:8px;background:var(--chipBg);color:var(--muted)}
.tag.pl{background:var(--accentSoft);color:var(--accent);box-shadow:var(--shTag)}
.tag.auto{background:var(--okSoft);color:var(--ok)}
.tag.no-mark{background:var(--warnSoft);color:var(--warn)}
.rows{display:flex;flex-direction:column;gap:10px;padding:0 24px 28px;max-width:900px}
.row-item{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:18px;background:var(--cardBg);border:1px solid var(--cardBd);box-shadow:var(--shCard);flex-wrap:wrap}
.row-item .grow{flex:1;min-width:160px}
.row-item .t{font:600 14px/1 Onest;color:var(--ink)}
.row-item .m{margin-top:5px;font:400 12px/1.35 Onest;color:var(--muted)}
.pill{font:500 11.5px/1 Onest;padding:6px 11px;border-radius:9px;background:var(--chipBg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.pill.warn{background:var(--warnSoft);color:var(--warn)}
.mini{padding:9px 15px;border:1px solid var(--inputBg);border-radius:12px;background:var(--cardBd);font:600 12.5px/1 Onest;color:var(--ink2);white-space:nowrap}
.mini.danger{color:var(--warn)}
.ideas{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;align-items:start;padding:0 24px 28px;max-width:1100px}
.idea{padding:16px 17px;border-radius:18px;background:var(--cardBg);border:1px solid var(--cardBd);box-shadow:var(--shCard);cursor:pointer}
.idea .k{font:600 11px/1 Onest;color:var(--accent);letter-spacing:.02em}
.idea p{margin:8px 0 0;font:400 13.5px/1.5 Onest;color:var(--ink);text-wrap:pretty}
.idea.done{background:var(--mutedCardBg);border-color:var(--chipBg);box-shadow:none}
.idea.done .k,.idea.done p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px;border-radius:20px;background:var(--cardBg);border:1px solid var(--cardBd)}
.stat b{display:block;font:700 32px/1.1 Onest;color:var(--ink);letter-spacing:-.02em}
.stat span{font:400 12.5px/1.3 Onest;color:var(--muted)}
.stat.alert{border-color:var(--warnBd)}
.stat.alert b{color:var(--warn)}
.chart{margin-top:16px;padding:20px;border-radius:22px;background:var(--panelBg);border:1px solid var(--cardBd)}
.chart h3{font:600 15px/1 Onest;color:var(--ink)}
.chart .sub{margin-top:6px;font:400 12.5px/1.4 Onest;color:var(--muted)}
.chart .rows{padding:0;max-width:none;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:7px;height:150px;margin-top:18px}
.bars i{flex:1;border-radius:7px;background:var(--barBg);box-shadow:var(--shBar);display:block;min-height:4px}
.bars i.low{background:var(--barLow);box-shadow:none}
.days{display:flex;gap:7px;margin-top:8px}
.days span{flex:1;text-align:center;font:400 10.5px/1 Onest;color:var(--muted);overflow:hidden}
.empty{padding:24px 6px;font:400 13px/1.5 Onest;color:var(--muted);max-width:460px}
#p-stats,#p-ideas{padding:0 24px 28px}
#p-ideas .ideas,#p-stats .stats{padding:0}
#p-ideas .row{padding:0;margin:0 0 14px}

/* ── окна: тот же материал, что панель отбора в макете ───────────── */
.veil{position:fixed;inset:0;z-index:40;background:rgba(20,16,10,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.veil.on{display:flex}
.win{width:100%;max-width:520px;border-radius:26px;border:1px solid var(--panelBd);background:var(--panelBlur);backdrop-filter:blur(18px);box-shadow:var(--shPanel);padding:22px 22px 24px}
.win h2{font:700 20px/1 Onest;color:var(--ink);letter-spacing:-.02em}
.win .lead{margin-top:8px;font:400 13px/1.5 Onest;color:var(--muted)}
.field{margin-top:18px}
.field label{display:block;font:600 13.5px/1 Onest;color:var(--ink);margin-bottom:10px}
.field input,.field select,.field textarea{width:100%;padding:13px 16px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);box-shadow:var(--shCard);font:500 13.5px/1.3 Onest;color:var(--ink2);outline:none}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wbtns{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap;align-items:center}
.note{margin-top:10px;font:400 12px/1.5 Onest;color:var(--muted)}
.danger{color:var(--warn)}
.copy{width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);font:500 12.5px/1.4 Onest;color:var(--ink2);word-break:break-all;text-align:left;cursor:copy}
.plist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.pchk{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--sunkBg);border:1px solid var(--cardBd);font:500 13.5px/1 Onest;color:var(--ink2);cursor:pointer}
.rule-row{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:14px;background:var(--sunkBg);border:1px solid var(--cardBd);margin-top:9px;flex-wrap:wrap}
.rule-row .grow{flex:1;min-width:150px;font:500 13px/1.3 Onest;color:var(--ink2)}

/* ── пин и уведомление ───────────────────────────────────────────── */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--pageBg)}
.gate .box{width:300px;padding:24px;border-radius:26px;border:1px solid var(--panelBd);background:var(--panelBlur);box-shadow:var(--shPanel);text-align:center}
.gate h2{font:700 20px/1 Onest;color:var(--ink);margin-bottom:16px}
.gate input{width:100%;padding:13px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);text-align:center;letter-spacing:.3em;font:500 15px/1 Onest;color:var(--ink);outline:none}
.gate .err{margin-top:10px;font:400 12px/1.4 Onest;color:var(--warn);min-height:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;padding:13px 20px;border-radius:14px;background:var(--btnBg);color:var(--btnFg);font:600 13px/1 Onest;box-shadow:var(--shBtn);display:none}
.toast.on{display:block}
.hide{display:none!important}
.mnav{display:none}

@media (max-width:900px){
  .page{padding:0}
  .frame{min-width:0;border-radius:0;border:0;box-shadow:none;min-height:100vh}
  .grid{grid-template-columns:1fr;min-height:0}
  .rail{display:none}
  .top{padding:calc(12px + var(--safe-top)) 14px 12px;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--winBg)}
  .mnav{display:flex;gap:7px;padding:10px 14px 0;overflow:auto}
  .mnav button{padding:9px 15px;border-radius:12px;border:1px solid var(--cardBd);background:var(--chipBg);font:500 13px/1 Onest;color:var(--muted);white-space:nowrap}
  .mnav button.on{border-color:var(--navOnBd);background:var(--navOnBg);box-shadow:var(--navOnSh);color:var(--ink);font-weight:600}
  .head{padding:16px 14px 12px}
  .board,.rows,.ideas,#p-stats,#p-ideas{padding-left:14px;padding-right:14px}
  .board{grid-template-columns:1fr}
  .ideas{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .hide-mob{display:none}
  .win{padding:20px;border-radius:22px}
  .veil{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="page">
  <div class="shaft"></div>
  <div class="leak" id="leak1"></div>
  <div class="leak" id="leak2"></div>
  <div class="leak" id="leak3"></div>
  <div class="leak" id="leak4"></div>

  <div class="frame hide" id="shell">
    <div class="leak" id="leak5"></div>
    <div class="leak" id="leak6"></div>
    <div class="leak" id="leak7"></div>

    <header class="top">
      <div class="brand">
        <div class="mark"><i></i></div>
        <b>Контент-завод</b>
      </div>
      <input class="search hide-mob" id="q" placeholder="Поиск по единицам и занятиям">
      <div class="spacer hide-mob"></div>
      <button class="chip" id="fbtn">Фильтры<b id="fcount">0</b></button>
      <button class="iconbtn" id="theme" aria-label="Тема">☾</button>
      <button class="primary" id="newbtn">Новая единица</button>
    </header>
    <div class="mnav" id="mnav">
      <button class="on" data-p="queue">Очередь</button>
      <button data-p="raw">Сырьё</button>
      <button data-p="ideas">Замыслы</button>
      <button data-p="stats">Числа</button>
    </div>

    <div class="grid">
      <aside class="rail">
      <nav class="nav" id="nav">
      <button class="on" data-p="queue">Очередь<span class="n" id="n-queue"></span></button>
      <button data-p="raw">Сырьё<span class="n" id="n-raw"></span></button>
      <button data-p="ideas">Замыслы<span class="n" id="n-ideas"></span></button>
      <button data-p="stats">Числа<span class="n"></span></button>
    </nav>
    <div class="norm">
      <h3>Сегодня выложено</h3>
      <div class="big"><span id="today">0</span><small>из <span id="normv">5</span></small></div>
      <div class="track"><i id="normbar" style="width:0%"></i></div>
    </div>
    <div class="railnote" id="railnote"></div>
  </aside>
      <div class="main">
        <div class="head">
          <div><h1 id="ttl">Очередь</h1><div class="sub" id="sub">загружаю…</div></div>
        </div>
        <section class="pane on" id="p-queue"><div class="board" id="board"></div></section>
    <section class="pane" id="p-raw"><div class="rows" id="rawrows"></div></section>
    <section class="pane" id="p-ideas">
      <div class="row" style="margin:0 0 14px">
        <button class="ghost" id="newidea">Записать замысел</button>
      </div>
      <div class="ideas" id="ideas"></div>
    </section>
    <section class="pane" id="p-stats"><div id="statsbox"></div></section>
  </div>
</div>

</div>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <div class="box">
    <h2>Контент-завод</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="пин" autocomplete="off">
    <div class="err" id="pinerr"></div>
  </div>
</div>

<div class="veil" id="veil"><div class="win" id="win"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  КОНТЕНТ-ЗАВОД — экран на ручках app/factory.py
//  Вход по тому же пину, что дашборд и доска задач. ⚠️ Ключ живёт в
//  sessionStorage, а он у каждой вкладки свой: пин здесь вводится
//  отдельно от дашборда, это не поломка.
// ═══════════════════════════════════════════════════════════════════
var API = 'https://api.youselllikeagod-magazine.ru';
var KEY = '';
var S = {pieces:[],ideas:[],rules:[],raw:[],dict:{formats:[],platforms:[],statuses:[],idea_kinds:[]}};
var STATS = null;
var PANE = 'queue';
var FILTERS = {platform:'',fmt:'',mark:''};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); },2200); }

function api(path, opts){
  opts = opts || {};
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  return fetch(API + path + sep + 'x_admin_token=' + encodeURIComponent(KEY), {
    method: opts.method || 'GET',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error((d && d.detail) || ('сервер ответил ' + r.status));
      return d;
    });
  });
}

/* ── вход ───────────────────────────────────────────────────────── */
$('pin').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var pin = $('pin').value.trim();
  if (!pin) return;
  $('pinerr').textContent = '';
  fetch(API + '/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:pin})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if (!res.ok) throw new Error((res.d && res.d.detail) || 'не пускает');
      KEY = res.d.token || res.d.key || pin;
      try { sessionStorage.setItem('factory_key', KEY); } catch(e){}
      $('gate').classList.add('hide');
      $('shell').classList.remove('hide');
      load();
    })
    .catch(function(e){ $('pinerr').textContent = e.message; });
});
try {
  var saved = sessionStorage.getItem('factory_key');
  if (saved) { KEY = saved; $('gate').classList.add('hide'); $('shell').classList.remove('hide'); }
} catch(e){}

/* ── загрузка ───────────────────────────────────────────────────── */
function load(){
  return api('/factory/state').then(function(d){
    S = d;
    renderAll();
    return api('/factory/stats?days=30');
  }).then(function(s){
    STATS = s;
    renderNorm();
    if (PANE === 'stats') renderStats();
  }).catch(function(e){
    $('sub').textContent = 'не открылось: ' + e.message;
  });
}

function label(list, key){
  for (var i=0;i<list.length;i++) if (list[i].key === key) return list[i].label;
  return key || '';
}

/* ── вкладки ────────────────────────────────────────────────────── */
function go(p){
  PANE = p;
  var panes = document.querySelectorAll('.pane');
  for (var i=0;i<panes.length;i++) panes[i].classList.toggle('on', panes[i].id === 'p-' + p);
  var btns = document.querySelectorAll('#nav button, #mnav button');
  for (var j=0;j<btns.length;j++) btns[j].classList.toggle('on', btns[j].dataset.p === p);
  if (p === 'stats') renderStats();
  head();
}
(function(){
  var btns = document.querySelectorAll('#nav button, #mnav button');
  for (var i=0;i<btns.length;i++) (function(b){ b.addEventListener('click', function(){ go(b.dataset.p); }); })(btns[i]);
})();

$('theme').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  $('theme').textContent = dark ? '☾' : '☀';
});
$('q').addEventListener('input', function(){ renderBoard(); renderRaw(); });

/* ── шапка и левая колонка ──────────────────────────────────────── */
function head(){
  var live = S.pieces.filter(function(p){ return p.status !== 'dropped'; });
  var queue = live.filter(function(p){ return p.status !== 'published'; });
  var nomark = live.filter(function(p){ return p.no_mark; });
  var openIdeas = S.ideas.filter(function(i){ return i.status === 'open'; });
  var unworked = S.raw.filter(function(r){ return !r.pieces; });

  $('n-queue').textContent = queue.length;
  $('n-raw').textContent = S.raw.length;
  $('n-ideas').textContent = openIdeas.length;

  var T = {
    queue: ['Очередь', queue.length + ' в работе · ' + nomark.length + ' без метки'],
    raw:   ['Сырьё', S.raw.length + ' занятий · ' + unworked.length + ' без единиц'],
    ideas: ['Замыслы', openIdeas.length + ' в копилке'],
    stats: ['Числа', 'За 30 дней, по дням']
  };
  $('ttl').textContent = T[PANE][0];
  $('sub').textContent = T[PANE][1];
  $('railnote').innerHTML = unworked.length
    ? '<b>' + unworked.length + '</b> занятий ещё не разобраны заводом — из них не сделано ни одной единицы.'
    : 'Все занятия разобраны заводом.';
}

function renderNorm(){
  if (!STATS) return;
  $('today').textContent = STATS.today;
  $('normv').textContent = STATS.norm;
  var pct = STATS.norm ? Math.min(100, Math.round(STATS.today * 100 / STATS.norm)) : 0;
  $('normbar').style.width = pct + '%';
}

function renderAll(){ head(); renderBoard(); renderRaw(); renderIdeas(); }

/* ── очередь ────────────────────────────────────────────────────── */
function matches(p){
  var q = $('q').value.trim().toLowerCase();
  if (q && (p.title || '').toLowerCase().indexOf(q) < 0 && (p.lecture_slug || '').toLowerCase().indexOf(q) < 0) return false;
  if (FILTERS.platform && p.platform !== FILTERS.platform) return false;
  if (FILTERS.fmt && p.fmt !== FILTERS.fmt) return false;
  if (FILTERS.mark === 'no' && !p.no_mark) return false;
  return true;
}

function cardHtml(p){
  var src = p.lecture_slug
    ? 'Занятие «' + esc(p.lecture_slug) + '»' + (p.timecode ? ' · ' + esc(p.timecode) : '')
    : (p.idea_id ? 'Из замысла' : 'Без привязки к занятию');
  if (p.status === 'published') {
    src = esc(p.platform_label) + (p.published_at ? ' · выложено ' + esc(p.published_at) : '');
  }
  var tags = '<span class="tag pl">' + esc(p.fmt_label) + '</span>';
  if (p.status !== 'published') tags += '<span class="tag">' + esc(p.platform_label) + '</span>';
  if (p.auto) tags += '<span class="tag auto">заведено само</span>';
  if (p.no_mark) tags += '<span class="tag no-mark">без метки</span>';
  else if (p.source_code) tags += '<span class="tag">метка ' + esc(p.source_code) + '</span>';
  return '<div class="card' + (p.no_mark ? ' flag' : '') + '" draggable="true" data-id="' + p.id + '">' +
         '<div class="t">' + esc(p.title || 'без названия') + '</div>' +
         // Суть — прямо на карточке: главный вопрос к очереди «о чём это и
         // откуда», а не «как называется»
         (p.insight ? '<div class="ins">' + esc(p.insight) + '</div>' : '') +
         '<div class="src">' + src + '</div>' +
         '<div class="row">' + tags + '</div></div>';
}

function renderBoard(){
  var cols = (S.dict.statuses || []).filter(function(s){ return s.key !== 'dropped'; });
  var html = '';
  for (var i=0;i<cols.length;i++){
    var st = cols[i];
    var list = S.pieces.filter(function(p){ return p.status === st.key && matches(p); });
    html += '<div class="col" data-col="' + st.key + '">' +
            '<div class="colhead"><b>' + esc(st.label) + '</b><span>' + list.length + '</span></div>' +
            (list.length ? list.map(cardHtml).join('') : '') +
            '</div>';
  }
  $('board').innerHTML = html || '<div class="empty">Очередь пуста. Заведи правила производства и прогони их по библиотеке — заготовки появятся сами.</div>';
  wireBoard();
  head();
}

var held = null;
function wireBoard(){
  var cards = document.querySelectorAll('#board .card');
  for (var i=0;i<cards.length;i++) (function(c){
    c.addEventListener('dragstart', function(){ held = c; c.classList.add('dragging'); });
    c.addEventListener('dragend', function(){ c.classList.remove('dragging'); held = null; });
    c.addEventListener('click', function(){ openPiece(Number(c.dataset.id)); });
  })(cards[i]);
  var cols = document.querySelectorAll('#board [data-col]');
  for (var j=0;j<cols.length;j++) (function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault(); col.classList.remove('over');
      if (!held) return;
      var id = Number(held.dataset.id), st = col.dataset.col;
      // ⚠️ В «опубликовано» перетащить МОЖНО, но метку это не заводит —
      // единица честно светится как брак, пока не пройдёт публикацию
      api('/factory/piece/' + id + '/status', {method:'POST', body:{status:st}})
        .then(function(r){ replace(r.piece); renderBoard(); if (r.piece.no_mark) toast('Выложено без метки — открой карточку и опубликуй'); })
        .catch(function(e){ toast(e.message); });
    });
  })(cols[j]);
}

function replace(p){
  for (var i=0;i<S.pieces.length;i++) if (S.pieces[i].id === p.id) { S.pieces[i] = p; return; }
  S.pieces.unshift(p);
}

/* ── сырьё ──────────────────────────────────────────────────────── */
function renderRaw(){
  var q = $('q').value.trim().toLowerCase();
  var rows = S.raw.filter(function(r){
    return !q || (r.title || '').toLowerCase().indexOf(q) >= 0 || (r.slug || '').toLowerCase().indexOf(q) >= 0;
  });
  if (!rows.length) { $('rawrows').innerHTML = '<div class="empty">Занятий не нашлось.</div>'; return; }
  $('rawrows').innerHTML = rows.map(function(r){
    var meta = [];
    if (r.stream_title) meta.push('Поток «' + esc(r.stream_title) + '»');
    if (r.duration_minutes) meta.push(r.duration_minutes + ' мин');
    meta.push(r.insights ? (r.insights + ' мыслей, ' + r.insights_main + ' главных') : 'мыслей нет');
    if (!r.timecodes) meta.push('таймкодов нет');
    if (!r.has_transcript) meta.push('транскрипта нет');
    var pill = r.pieces
      ? '<span class="pill ok">' + r.pieces + ' ед.</span>'
      : '<span class="pill warn">не разобрано</span>';
    return '<div class="row-item"><div class="grow"><div class="t">' + esc(r.title || r.slug) + '</div>' +
           '<div class="m">' + meta.join(' · ') + '</div></div>' + pill +
           '<button class="mini" data-new="' + esc(r.slug) + '">Завести единицу</button></div>';
  }).join('');
  var btns = $('rawrows').querySelectorAll('[data-new]');
  for (var i=0;i<btns.length;i++) (function(b){
    b.addEventListener('click', function(){ openPiece(null, b.dataset.new); });
  })(btns[i]);
}

/* ── замыслы ────────────────────────────────────────────────────── */
function renderIdeas(){
  if (!S.ideas.length) { $('ideas').innerHTML = '<div class="empty">Пока пусто. Сюда идут гипотезы, идеи съёмок и «повторить текст занятия» — всё, что ещё не работа, но уже намерение.</div>'; return; }
  $('ideas').innerHTML = S.ideas.map(function(i){
    var st = i.status === 'open' ? 'копится' : (i.status === 'taken' ? 'взято в работу' : 'отброшено');
    return '<div class="idea' + (i.status === 'dropped' ? ' done' : '') + '" data-idea="' + i.id + '">' +
           '<div class="k">' + esc(i.kind_label) + '</div><p>' + esc(i.body) + '</p>' +
           '<div class="row"><span class="tag">' + st + '</span>' +
           (i.lecture_slug ? '<span class="tag">' + esc(i.lecture_slug) + '</span>' : '') + '</div></div>';
  }).join('');
  var cards = $('ideas').querySelectorAll('[data-idea]');
  for (var i=0;i<cards.length;i++) (function(c){
    c.addEventListener('click', function(){ openIdea(Number(c.dataset.idea)); });
  })(cards[i]);
}

/* ── числа ──────────────────────────────────────────────────────── */
function renderStats(){
  if (!STATS) { $('statsbox').innerHTML = '<div class="empty">Считаю…</div>'; return; }
  var max = 1;
  for (var i=0;i<STATS.series.length;i++) if (STATS.series[i].count > max) max = STATS.series[i].count;
  var bars = STATS.series.map(function(d){
    return '<i class="' + (d.low ? 'low' : '') + '" style="height:' + Math.round(d.count * 100 / max) + '%"></i>';
  }).join('');
  var days = STATS.series.map(function(d){ return '<span>' + d.date.slice(8) + '</span>'; }).join('');
  var srcRows = (STATS.sources || []).slice(0, 12).map(function(s){
    return '<div class="row-item"><div class="grow"><div class="t">' + esc(s.title || s.code) + '</div>' +
           '<div class="m">метка ' + esc(s.code) + '</div></div>' +
           '<span class="pill">' + touchLabel(s.touches) + '</span>' +
           '<span class="pill">' + s.came + ' пришло</span><span class="pill ok">' + s.paid + ' оплат</span></div>';
  }).join('');

  $('statsbox').innerHTML =
    '<div class="stats">' +
      '<div class="stat"><b>' + STATS.published_period + '</b><span>выложено за 30 дней</span></div>' +
      '<div class="stat"><b>' + STATS.in_queue + '</b><span>в очереди</span></div>' +
      '<div class="stat' + (STATS.no_mark ? ' alert' : '') + '"><b>' + STATS.no_mark + '</b><span>выложено без метки</span></div>' +
      '<div class="stat' + (STATS.lectures_unworked ? ' alert' : '') + '"><b>' + STATS.lectures_unworked + '</b><span>занятий без единиц</span></div>' +
    '</div>' +
    '<div class="chart"><h3>Выложено по дням</h3>' +
      '<div class="sub">Серым — дни ниже нормы в ' + STATS.norm + ' единиц</div>' +
      '<div class="bars">' + bars + '</div><div class="days">' + days + '</div></div>' +
    cutBlock('Что работает по формату', STATS.by_format) +
    cutBlock('Что работает по площадке', STATS.by_platform) +
    (srcRows ? '<div class="chart"><h3>Отдача по меткам завода</h3>' +
      '<div class="sub">' + (STATS.touches_measured ? 'Переходы, приходы и оплаты по каждой метке'
        : 'Переходы пока не измеряются — нужен вызов счётчика в общем main.py') + '</div>' +
      '<div class="rows">' + srcRows + '</div></div>' : '') +
    '<div class="chart"><h3>Правила производства</h3>' +
      '<div class="sub">Появилось занятие — заготовки по правилам возникают в очереди сами</div>' +
      '<div id="rules"></div>' +
      '<div class="wbtns"><button class="ghost" id="addrule">Новое правило</button>' +
      '<button class="primary" id="gen">Прогнать по библиотеке</button></div></div>';

  renderRules();
  $('addrule').addEventListener('click', function(){ openRule(); });
  $('gen').addEventListener('click', generate);
}

// ⚠️ «Нет данных» и «ноль переходов» — РАЗНЫЕ ВЕЩИ. Пока счётчик не подключён,
// ноль на экране означал бы «никто не переходил», и правила правились бы по
// выдуманному числу
function touchLabel(n){
  return STATS && STATS.touches_measured ? (n + ' переходов') : 'переходы не считаются';
}

function cutBlock(title, rows){
  if (!rows || !rows.length) return '';
  var body = rows.map(function(r){
    return '<div class="row-item"><div class="grow"><div class="t">' + esc(r.label || r.key || 'без вида') + '</div>' +
           '<div class="m">' + r.pieces + ' выложено</div></div>' +
           '<span class="pill">' + touchLabel(r.touches) + '</span>' +
           '<span class="pill">' + r.came + ' пришло</span>' +
           '<span class="pill' + (r.paid ? ' ok' : '') + '">' + r.paid + ' оплат</span></div>';
  }).join('');
  return '<div class="chart"><h3>' + title + '</h3>' +
         '<div class="sub">Отсюда правятся правила производства — по факту, а не по ощущению</div>' +
         '<div class="rows">' + body + '</div></div>';
}

function renderRules(){
  var box = $('rules');
  if (!box) return;
  if (!S.rules.length) { box.innerHTML = '<div class="empty">Правил нет. Пока их нет, очередь наполняется только руками.</div>'; return; }
  box.innerHTML = S.rules.map(function(r){
    return '<div class="rule-row"><div class="grow">' + esc(r.title_tpl) + '</div>' +
           '<span class="tag pl">' + esc(label(S.dict.formats, r.fmt)) + '</span>' +
           '<span class="tag">' + esc(label(S.dict.platforms, r.platform)) + '</span>' +
           '<span class="tag">' + (r.stream_key ? 'поток ' + esc(r.stream_key) : 'все занятия') + '</span>' +
           '<button class="mini" data-rule="' + r.id + '">Править</button>' +
           '<button class="mini danger" data-rmrule="' + r.id + '">Убрать</button></div>';
  }).join('');
  var ed = box.querySelectorAll('[data-rule]');
  for (var i=0;i<ed.length;i++) (function(b){ b.addEventListener('click', function(){ openRule(Number(b.dataset.rule)); }); })(ed[i]);
  var rm = box.querySelectorAll('[data-rmrule]');
  for (var j=0;j<rm.length;j++) (function(b){
    b.addEventListener('click', function(){
      api('/factory/rule/' + b.dataset.rmrule, {method:'DELETE'}).then(function(){
        S.rules = S.rules.filter(function(r){ return r.id !== Number(b.dataset.rmrule); });
        renderRules();
      }).catch(function(e){ toast(e.message); });
    });
  })(rm[j]);
}

// ⚠️ Прогон СНАЧАЛА СУХОЙ: показывает, сколько карточек придёт, и только
// потом заводит. Двести штук, свалившихся в очередь без предупреждения,
// — это не помощь
function generate(){
  api('/factory/generate', {method:'POST', body:{dry_run:true, only_unworked:true}})
    .then(function(d){
      if (!d.planned) { toast(d.note || 'Новых заготовок не набралось'); return; }
      openWin('<h2>Прогон правил</h2><div class="lead">Придёт ' + d.planned + ' заготовок в статусе «Идея»</div>' +
        '<div class="rows">' + d.items.slice(0,6).map(function(it){
          return '<div class="row-item"><div class="grow"><div class="t">' + esc(it.title) + '</div>' +
                 '<div class="m">' + esc(it.lecture_slug) + '</div></div></div>';
        }).join('') + '</div>' +
        (d.planned > 6 ? '<div class="note">…и ещё ' + (d.planned - 6) + '</div>' : '') +
        '<div class="note">Отброшенное раньше не вернётся: отказ помнится навсегда.</div>' +
        '<div class="wbtns"><button class="ghost" data-x="close">Отмена</button><div class="spacer"></div>' +
        '<button class="primary" data-x="gen-go">Завести ' + d.planned + '</button></div>');
    })
    .catch(function(e){ toast(e.message); });
}

/* ── окна ───────────────────────────────────────────────────────── */
function openWin(html){
  $('win').innerHTML = html;
  $('veil').classList.add('on');
  var btns = $('win').querySelectorAll('[data-x]');
  for (var i=0;i<btns.length;i++) (function(b){ b.addEventListener('click', function(){ act(b.dataset.x); }); })(btns[i]);
}
function closeWin(){ $('veil').classList.remove('on'); $('win').innerHTML = ''; }
$('veil').addEventListener('click', function(e){ if (e.target === $('veil')) closeWin(); });

function opts(list, sel){
  return list.map(function(o){
    return '<option value="' + esc(o.key) + '"' + (o.key === sel ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  }).join('');
}
function pieceById(id){
  for (var i=0;i<S.pieces.length;i++) if (S.pieces[i].id === id) return S.pieces[i];
  return null;
}

var EDIT = null;

function openPiece(id, slug){
  var p = id ? pieceById(id) : null;
  EDIT = p;
  var title = p ? 'Единица' : 'Новая единица';
  openWin('<h2>' + title + '</h2>' +
    (p ? '<div class="lead">' + esc(p.fmt_label) + ' · ' + esc(p.platform_label) + (p.source_code ? ' · метка ' + esc(p.source_code) : '') + '</div>' : '<div class="lead">Одна публикация на одной площадке</div>') +
    '<div class="field"><label>Название</label><input id="f-title" value="' + esc(p ? p.title : '') + '"></div>' +
    '<div class="two">' +
      '<div class="field"><label>Формат</label><select id="f-fmt">' + opts(S.dict.formats, p ? p.fmt : 'video_short') + '</select></div>' +
      '<div class="field"><label>Площадка</label><select id="f-pl">' + opts(S.dict.platforms, p ? p.platform : 'tg') + '</select></div>' +
    '</div>' +
    '<div class="two">' +
      '<div class="field"><label>Ключ занятия</label><input id="f-slug" value="' + esc(p ? p.lecture_slug : (slug || '')) + '"></div>' +
      '<div class="field"><label>Таймкод</label><input id="f-tc" value="' + esc(p ? p.timecode : '') + '" placeholder="14:20"></div>' +
    '</div>' +
    '<div class="field"><label>Суть — о чём это</label><input id="f-ins" value="' + esc(p ? p.insight : '') + '" placeholder="одной строкой"></div>' +
    '<div class="field"><label>Сценарий или заметка</label><textarea id="f-note">' + esc(p ? p.note : '') + '</textarea></div>' +
    (p ? '<div class="wbtns"><button class="mini" data-x="draft">Написать черновик</button>' +
         '<span class="note" style="margin:0">по занятию и сути, тем же ключом, что игры</span></div>' : '') +
    '<div class="wbtns">' +
      (p ? '<button class="ghost danger" data-x="drop">Отбросить</button>' : '') +
      (p ? '<button class="ghost" data-x="spread">По площадкам</button>' : '') +
      '<div class="spacer"></div>' +
      (p && p.status !== 'published' ? '<button class="ghost" data-x="publish">Опубликовать</button>' : '') +
      (p && p.no_mark ? '<button class="ghost" data-x="publish">Завести метку</button>' : '') +
      '<button class="primary" data-x="save">Сохранить</button>' +
    '</div>');
}

function openPublish(){
  var p = EDIT;
  if (!p) return;
  var today = new Date().toISOString().slice(0,10);
  openWin('<h2>Публикация</h2>' +
    '<div class="lead">Отметить выложенным и завести метку атрибуции одним движением</div>' +
    '<div class="field"><label>Ссылка на публикацию</label><input id="f-url" value="' + esc(p.url) + '" placeholder="https://"></div>' +
    '<div class="two">' +
      '<div class="field"><label>Метка (пусто — соберу сам)</label><input id="f-code" value="' + esc(p.source_code) + '"></div>' +
      '<div class="field"><label>Дата</label><input id="f-date" value="' + (p.published_at || today) + '"></div>' +
    '</div>' +
    '<div class="note">Метка едет в диплинк, поэтому в ней только латиница, цифры, дефис и подчёркивание. Существующий код чужой единицей не перезаписывается.</div>' +
    '<div class="wbtns"><button class="ghost" data-x="back">Назад</button><div class="spacer"></div>' +
    '<button class="primary" data-x="pub-go">Опубликовать</button></div>');
}

function openSpread(){
  var p = EDIT;
  if (!p) return;
  var list = S.dict.platforms.filter(function(pl){ return pl.key !== p.platform; });
  openWin('<h2>Разложить по площадкам</h2>' +
    '<div class="lead">Одна работа — несколько единиц, у каждой своя метка</div>' +
    '<div class="plist">' + list.map(function(pl){
      return '<label class="pchk"><input type="checkbox" value="' + esc(pl.key) + '"> ' + esc(pl.label) + '</label>';
    }).join('') + '</div>' +
    '<div class="wbtns"><button class="ghost" data-x="back">Назад</button><div class="spacer"></div>' +
    '<button class="primary" data-x="spread-go">Создать</button></div>');
}

function openIdea(id){
  var it = null;
  for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === id) it = S.ideas[i];
  EDIT = it;
  openWin('<h2>' + (it ? 'Замысел' : 'Новый замысел') + '</h2>' +
    '<div class="lead">Гипотеза, идея съёмки, «повторить текст занятия»</div>' +
    '<div class="field"><label>Вид</label><select id="i-kind">' + opts(S.dict.idea_kinds, it ? it.kind : 'hypothesis') + '</select></div>' +
    '<div class="field"><label>Своими словами</label><textarea id="i-body">' + esc(it ? it.body : '') + '</textarea></div>' +
    '<div class="field"><label>Ключ занятия, если есть</label><input id="i-slug" value="' + esc(it ? it.lecture_slug : '') + '"></div>' +
    '<div class="wbtns">' +
      (it ? '<button class="ghost danger" data-x="idea-drop">Отбросить</button>' : '') +
      '<div class="spacer"></div>' +
      (it ? '<button class="ghost" data-x="idea-take">Взять в работу</button>' : '') +
      '<button class="primary" data-x="idea-save">Сохранить</button>' +
    '</div>');
}

function openRule(id){
  var r = null;
  for (var i=0;i<S.rules.length;i++) if (S.rules[i].id === id) r = S.rules[i];
  EDIT = r;
  openWin('<h2>' + (r ? 'Правило' : 'Новое правило') + '</h2>' +
    '<div class="lead">«На каждое занятие — рилс в Телеграм»</div>' +
    '<div class="field"><label>Заголовок заготовки</label><input id="r-tpl" value="' + esc(r ? r.title_tpl : '{title}') + '"><div class="note">{title} подставит название занятия</div></div>' +
    '<div class="two">' +
      '<div class="field"><label>Формат</label><select id="r-fmt">' + opts(S.dict.formats, r ? r.fmt : 'video_short') + '</select></div>' +
      '<div class="field"><label>Площадка</label><select id="r-pl">' + opts(S.dict.platforms, r ? r.platform : 'tg') + '</select></div>' +
    '</div>' +
    '<div class="field"><label>Только поток (пусто — все занятия)</label><input id="r-stream" value="' + esc(r ? r.stream_key : '') + '"></div>' +
    '<div class="wbtns"><button class="ghost" data-x="close">Отмена</button><div class="spacer"></div>' +
    '<button class="primary" data-x="rule-save">Сохранить</button></div>');
}

function openFilters(){
  openWin('<h2>Отбор</h2><div class="lead">Пусто — значит все</div>' +
    '<div class="two">' +
      '<div class="field"><label>Площадка</label><select id="x-pl"><option value="">Все</option>' + opts(S.dict.platforms, FILTERS.platform) + '</select></div>' +
      '<div class="field"><label>Формат</label><select id="x-fmt"><option value="">Все</option>' + opts(S.dict.formats, FILTERS.fmt) + '</select></div>' +
    '</div>' +
    '<div class="field"><label>Состояние</label><select id="x-mark">' +
      '<option value="">Любое</option><option value="no"' + (FILTERS.mark === 'no' ? ' selected' : '') + '>Ждут метку</option>' +
    '</select></div>' +
    '<div class="wbtns"><button class="ghost" data-x="filters-clear">Сбросить</button><div class="spacer"></div>' +
    '<button class="primary" data-x="filters-go">Применить</button></div>');
}

/* ── действия окон ──────────────────────────────────────────────── */
function act(what){
  if (what === 'close') { closeWin(); return; }
  if (what === 'back') { openPiece(EDIT ? EDIT.id : null); return; }

  if (what === 'save') {
    var body = {
      id: EDIT ? EDIT.id : null,
      title: $('f-title').value,
      note: $('f-note').value,
      fmt: $('f-fmt').value,
      platform: $('f-pl').value,
      status: EDIT ? EDIT.status : 'idea',
      lecture_slug: $('f-slug').value.trim(),
      timecode: $('f-tc').value.trim(),
      insight: $('f-ins').value.trim()
    };
    api('/factory/piece', {method:'POST', body:body})
      .then(function(r){ replace(r.piece); closeWin(); renderBoard(); toast('Сохранено'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'draft') {
    // ⚠️ Сначала СОХРАНЯЕМ правки, потом просим черновик: иначе он напишется
    // по старой сути, а свежая, только что набранная, потеряется
    var btn = $('win').querySelector('[data-x="draft"]');
    if (btn) { btn.textContent = 'Пишу…'; btn.disabled = true; }
    api('/factory/piece', {method:'POST', body:{
      id: EDIT.id, title: $('f-title').value, note: $('f-note').value,
      fmt: $('f-fmt').value, platform: $('f-pl').value, status: EDIT.status,
      lecture_slug: $('f-slug').value.trim(), timecode: $('f-tc').value.trim(),
      insight: $('f-ins').value.trim()
    }})
      .then(function(r){ replace(r.piece); EDIT = r.piece;
        return api('/factory/piece/' + EDIT.id + '/draft', {method:'POST', body:{save:true}}); })
      .then(function(r){ replace(r.piece); EDIT = r.piece; openPiece(EDIT.id); renderBoard(); toast('Черновик готов'); })
      .catch(function(e){ toast(e.message); if (btn) { btn.textContent = 'Написать черновик'; btn.disabled = false; } });
    return;
  }
  if (what === 'publish') { openPublish(); return; }
  if (what === 'pub-go') {
    api('/factory/piece/' + EDIT.id + '/publish', {method:'POST', body:{
      url: $('f-url').value.trim(), code: $('f-code').value.trim(), published_at: $('f-date').value.trim()
    }}).then(function(r){
      replace(r.piece); renderBoard();
      openWin('<h2>Выложено</h2><div class="lead">Метка ' + esc(r.piece.source_code) + ' заведена в источниках</div>' +
        '<button class="copy" data-x="copy" data-link="' + esc(r.deeplink) + '">' + esc(r.deeplink) + '</button>' +
        '<div class="note">Нажми, чтобы скопировать.</div>' +
        '<div class="wbtns"><div class="spacer"></div><button class="primary" data-x="close">Готово</button></div>');
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'copy') {
    var link = $('win').querySelector('[data-link]').dataset.link;
    if (navigator.clipboard) navigator.clipboard.writeText(link);
    toast('Ссылка скопирована');
    return;
  }
  if (what === 'spread') { openSpread(); return; }
  if (what === 'spread-go') {
    var picked = [];
    var boxes = $('win').querySelectorAll('input[type=checkbox]');
    for (var i=0;i<boxes.length;i++) if (boxes[i].checked) picked.push(boxes[i].value);
    if (!picked.length) { toast('Ни одной площадки не выбрано'); return; }
    api('/factory/piece/' + EDIT.id + '/spread', {method:'POST', body:{platforms:picked}})
      .then(function(r){
        for (var j=0;j<r.created.length;j++) S.pieces.unshift(r.created[j]);
        closeWin(); renderBoard();
        toast(r.created.length ? ('Создано: ' + r.created.length) : 'Такие единицы уже есть');
      }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'drop') {
    api('/factory/piece/' + EDIT.id, {method:'DELETE'})
      .then(function(r){ replace(r.piece); closeWin(); renderBoard(); toast('Отброшено'); })
      .catch(function(e){ toast(e.message); });
    return;
  }

  if (what === 'idea-save') {
    api('/factory/idea', {method:'POST', body:{
      id: EDIT ? EDIT.id : null, kind: $('i-kind').value, body: $('i-body').value,
      lecture_slug: $('i-slug').value.trim(), status: EDIT ? EDIT.status : 'open'
    }}).then(function(r){
      var found = false;
      for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === r.idea.id) { S.ideas[i] = r.idea; found = true; }
      if (!found) S.ideas.unshift(r.idea);
      closeWin(); renderIdeas(); head();
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'idea-take') {
    api('/factory/idea/' + EDIT.id + '/take', {method:'POST', body:{title:'', fmt:'', platform:'tg'}})
      .then(function(r){
        S.pieces.unshift(r.piece);
        for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === r.idea.id) S.ideas[i] = r.idea;
        closeWin(); renderIdeas(); renderBoard(); toast('Единица заведена в очереди');
      }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'idea-drop') {
    api('/factory/idea/' + EDIT.id, {method:'DELETE'})
      .then(function(r){
        for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === r.idea.id) S.ideas[i] = r.idea;
        closeWin(); renderIdeas(); head();
      }).catch(function(e){ toast(e.message); });
    return;
  }

  if (what === 'rule-save') {
    api('/factory/rule', {method:'POST', body:{
      id: EDIT ? EDIT.id : null, title_tpl: $('r-tpl').value, fmt: $('r-fmt').value,
      platform: $('r-pl').value, stream_key: $('r-stream').value.trim(), active: true
    }}).then(function(r){
      var found = false;
      for (var i=0;i<S.rules.length;i++) if (S.rules[i].id === r.rule.id) { S.rules[i] = r.rule; found = true; }
      if (!found) S.rules.push(r.rule);
      closeWin(); renderRules();
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'gen-go') {
    api('/factory/generate', {method:'POST', body:{dry_run:false, only_unworked:true}})
      .then(function(d){ closeWin(); toast('Заведено: ' + d.created); return load(); })
      .catch(function(e){ toast(e.message); });
    return;
  }

  if (what === 'filters-go') {
    FILTERS = {platform:$('x-pl').value, fmt:$('x-fmt').value, mark:$('x-mark').value};
    applyFilterCount(); closeWin(); renderBoard();
    return;
  }
  if (what === 'filters-clear') {
    FILTERS = {platform:'', fmt:'', mark:''};
    applyFilterCount(); closeWin(); renderBoard();
    return;
  }
}

// ⚠️ Счётчик считает ВЫБРАННОЕ, а не «панель открыта»: в макете он врал
function applyFilterCount(){
  var n = 0;
  if (FILTERS.platform) n++;
  if (FILTERS.fmt) n++;
  if (FILTERS.mark) n++;
  $('fcount').textContent = n;
}

$('fbtn').addEventListener('click', openFilters);
$('newbtn').addEventListener('click', function(){ openPiece(null); });
$('newidea').addEventListener('click', function(){ openIdea(null); });

if (KEY) load();
</script>
