<!DOCTYPE html>
<!-- FILE_VERSION: factory_page-v8 -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Контент-завод</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/factory-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/factory-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/factory-192.png">
<link rel="shortcut icon" href="icons/factory.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/factory-apple-180.png">
<meta name="apple-mobile-web-app-title" content="Завод">
<meta name="theme-color" content="#211f1d">
<style>
/* ═══════════════════════════════════════════════════════════════════
   ОФОРМЛЕНИЕ СНЯТО С МАКЕТА `Контент-завод (без React)` ЗАМЕРАМИ.
   Отступы, радиусы, кегли, слои теней и размытий взяты из отрисованного
   макета браузером, а не подобраны на глаз. Имена переменных оставлены
   как в макете — чтобы следующая присылка ложилась без перевода.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --pageBg:#211f1d;
  --shaft:linear-gradient(118deg,rgba(255,232,199,0) 26%,rgba(255,229,190,.62) 38%,rgba(255,240,214,.30) 48%,rgba(255,229,190,0) 58%);
  --glowWarm:radial-gradient(closest-side,rgba(255,222,178,.42),rgba(255,222,178,0) 70%);
  --glowCool:radial-gradient(closest-side,rgba(214,205,255,.20),rgba(214,205,255,0) 70%);
  --leakCyan:radial-gradient(closest-side,rgba(112,196,214,.42),rgba(112,196,214,0) 72%);
  --leakViolet:radial-gradient(closest-side,rgba(126,110,226,.34),rgba(126,110,226,0) 74%);
  --leakWarm:radial-gradient(closest-side,rgba(255,236,206,.66),rgba(255,236,206,0) 72%);
  --panelLeakA:radial-gradient(closest-side,rgba(126,110,226,.62),rgba(126,110,226,0) 72%);
  --panelLeakB:radial-gradient(closest-side,rgba(112,196,214,.5),rgba(112,196,214,0) 74%);
  --winBg:linear-gradient(160deg,rgba(243,236,227,.94),rgba(233,223,210,.90));
  --cardBg:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5));
  --panelBg:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.44));
  --mutedCardBg:rgba(232,224,212,.6);
  --colBg:rgba(224,212,196,.44);
  --sunkBg:rgba(236,228,216,.82);
  --inputBg:rgba(255,255,255,.9);
  --inputBd:rgba(255,255,255,.95);
  --cardBd:rgba(255,255,255,.85);
  --chipBg:rgba(255,255,255,.62);
  --hairline:rgba(255,255,255,.5);
  --ink:#211d16;--ink2:#3a3428;--muted:#9c9284;
  --btnBg:#17150f;--btnHover:#2c281d;--btnFg:#fff;
  --accent:#5a4bc4;--accentSoft:rgba(126,110,226,.14);
  --ok:#3f7a5e;--okSoft:rgba(74,135,104,.14);
  --warn:#a8493a;--warnSoft:rgba(180,82,63,.14);--warnBd:rgba(180,82,63,.45);
  --barBg:linear-gradient(180deg,#7e6ee2,rgba(126,110,226,.4));
  --barLow:rgba(160,148,132,.4);
  --progBg:linear-gradient(90deg,#7e6ee2,#70c4d6);
  --trackBg:rgba(180,166,148,.32);
  --markBg:linear-gradient(140deg,#ffd479,#ff8f6b);
  --shCard:0 6px 16px -8px rgba(94,74,52,.45);
  --shSoft:0 2px 10px rgba(120,98,70,.10);
  --shBtn:0 10px 26px -8px rgba(23,21,15,.72);
  --shPanel:0 40px 80px -24px rgba(70,52,30,.55);
  --shWin:0 50px 110px -30px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.18);
  --navOnBg:rgba(255,255,255,.72);--navOnBd:rgba(255,255,255,.85);
  --navOnSh:0 6px 16px -8px rgba(94,74,52,.5);
  --shGlow:0 2px 10px -2px rgba(126,110,226,.5);
  --shBar:0 4px 10px -4px rgba(126,110,226,.45);
  --shTag:none;
  --panelBlur:linear-gradient(165deg,rgba(248,242,234,.9),rgba(238,229,216,.86));
  --panelBd:rgba(255,255,255,.72);
  --safe-top:0px;
}
html[data-theme="dark"]{
  --pageBg:#020204;
  --shaft:linear-gradient(118deg,rgba(140,120,255,0) 24%,rgba(150,130,255,.16) 38%,rgba(120,225,240,.13) 49%,rgba(140,120,255,0) 60%);
  --glowWarm:radial-gradient(closest-side,rgba(124,107,255,.34),rgba(124,107,255,0) 70%);
  --glowCool:radial-gradient(closest-side,rgba(63,200,228,.26),rgba(63,200,228,0) 70%);
  --leakCyan:radial-gradient(closest-side,rgba(63,200,228,.55),rgba(63,200,228,0) 72%);
  --leakViolet:radial-gradient(closest-side,rgba(124,107,255,.6),rgba(124,107,255,0) 74%);
  --leakWarm:radial-gradient(closest-side,rgba(255,120,190,.3),rgba(255,120,190,0) 72%);
  --panelLeakA:radial-gradient(closest-side,rgba(140,120,255,.8),rgba(140,120,255,0) 72%);
  --panelLeakB:radial-gradient(closest-side,rgba(63,220,228,.62),rgba(63,220,228,0) 74%);
  --winBg:linear-gradient(160deg,rgba(13,14,22,.94),rgba(5,5,9,.96));
  --cardBg:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  --panelBg:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  --mutedCardBg:rgba(255,255,255,.02);
  --colBg:rgba(148,160,255,.03);
  --sunkBg:rgba(255,255,255,.04);
  --inputBg:rgba(255,255,255,.07);
  --inputBd:rgba(174,166,255,.34);
  --cardBd:rgba(255,255,255,.12);
  --chipBg:rgba(255,255,255,.075);
  --hairline:rgba(255,255,255,.09);
  --ink:#eef0ff;--ink2:#c8cdea;--muted:#7c83a6;
  --btnBg:linear-gradient(135deg,#7c6bff,#3fc8e4);--btnHover:linear-gradient(135deg,#8f80ff,#59d7f0);--btnFg:#08080f;
  --accent:#b3a8ff;--accentSoft:rgba(124,107,255,.2);
  --ok:#6fe3ac;--okSoft:rgba(111,227,172,.16);
  --warn:#ff9b85;--warnSoft:rgba(255,155,133,.16);--warnBd:rgba(255,155,133,.5);
  --barBg:linear-gradient(180deg,#8f80ff,rgba(63,200,228,.35));
  --barLow:rgba(255,255,255,.12);
  --progBg:linear-gradient(90deg,#7c6bff,#3fc8e4);
  --trackBg:rgba(255,255,255,.09);
  --markBg:linear-gradient(140deg,#7c6bff,#3fc8e4);
  --shCard:0 10px 26px -14px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);
  --shSoft:0 2px 12px rgba(0,0,0,.5);
  --shBtn:0 14px 34px -8px rgba(124,107,255,.85),0 0 22px -4px rgba(63,200,228,.6);
  --shPanel:0 50px 90px -28px rgba(0,0,0,.9),0 0 60px -18px rgba(124,107,255,.45);
  --shWin:0 60px 130px -34px rgba(0,0,0,.95),0 0 0 1px rgba(148,160,255,.12);
  --navOnBg:rgba(124,107,255,.16);--navOnBd:rgba(174,166,255,.3);
  --navOnSh:0 0 24px -8px rgba(124,107,255,.7),inset 0 0 0 1px rgba(174,166,255,.14);
  --shGlow:0 0 18px -2px rgba(124,107,255,.85),0 0 44px -6px rgba(63,200,228,.55);
  --shBar:0 0 16px -3px rgba(124,107,255,.75);
  --shTag:0 0 14px -6px rgba(124,107,255,.9),inset 0 0 0 1px rgba(174,166,255,.16);
  --panelBlur:linear-gradient(165deg,rgba(18,19,30,.9),rgba(7,8,13,.93));
  --panelBd:rgba(174,166,255,.26);
}
*{box-sizing:border-box}
body{margin:0;background:var(--pageBg);font-family:Onest,'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,105,88,.35);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── подложка страницы и само окно ───────────────────────────────── */
.page{position:relative;min-height:100vh;padding:34px;background:var(--pageBg);overflow-x:auto}
.shaft{position:absolute;inset:0;pointer-events:none;background:var(--shaft)}
.leak{position:absolute;pointer-events:none}
#leak1{left:-18%;bottom:-34%;width:88%;height:96%;background:var(--glowWarm);filter:blur(30px)}
#leak2{right:-14%;top:-26%;width:74%;height:82%;background:var(--glowCool);filter:blur(34px)}
#leak3{left:38%;bottom:-46%;width:52%;height:70%;background:var(--glowCool);filter:blur(50px);transform:rotate(18deg) scaleX(1.5)}
#leak4{left:-6%;top:-14%;width:38%;height:44%;background:var(--glowWarm);filter:blur(44px);transform:scaleY(.6)}
#leak5{left:30%;top:-38%;width:64%;height:104%;background:var(--leakCyan);filter:blur(52px)}
#leak6{left:2%;top:-32%;width:54%;height:88%;background:var(--leakViolet);filter:blur(58px)}
#leak7{right:-12%;bottom:-32%;width:58%;height:82%;background:var(--leakWarm);filter:blur(48px)}
.frame{position:relative;min-width:1240px;border-radius:30px;overflow:hidden;border:1px solid var(--hairline);background:var(--winBg);box-shadow:var(--shWin)}
.grid{position:relative;display:grid;grid-template-columns:236px 1fr;min-height:840px}
.main{position:relative;min-width:0}

/* ── шапка ───────────────────────────────────────────────────────── */
.top{position:relative;display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--btnBg);display:grid;place-items:center;box-shadow:var(--shSoft);flex:none}
.brand .mark i{width:12px;height:12px;border-radius:4px;background:var(--markBg);transform:rotate(14deg);display:block}
.brand b{font:700 16px/1 Onest;color:var(--ink);letter-spacing:-.01em}
.brand span{display:none}
.search{flex:1;max-width:460px;padding:11px 16px;border-radius:14px;background:var(--chipBg);border:1px solid var(--cardBd);box-shadow:var(--shSoft);font:400 13.5px/1 Onest;color:var(--ink);outline:none}
.search::placeholder{color:var(--muted)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid var(--cardBd);border-radius:13px;background:var(--chipBg);font:600 13px/1 Onest;color:var(--ink2)}
.chip b{font:600 11px/1 Onest;color:var(--btnFg);background:var(--btnBg);padding:4px 7px;border-radius:6px;box-shadow:var(--shGlow)}
.iconbtn{width:38px;height:38px;border:1px solid var(--cardBd);border-radius:13px;background:var(--chipBg);color:var(--ink2);font:600 14px/1 Onest;flex:none}
.primary{padding:10px 18px;border-radius:13px;background:var(--btnBg);color:var(--btnFg);font:600 13px/1 Onest;box-shadow:var(--shBtn)}
.ghost{padding:9px 15px;border:1px solid var(--inputBg);border-radius:12px;background:var(--cardBd);font:600 12.5px/1 Onest;color:var(--ink2)}

/* ── рельс ───────────────────────────────────────────────────────── */
.rail{padding:20px 16px;border-right:1px solid var(--hairline);display:flex;flex-direction:column;gap:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid transparent;border-radius:13px;background:transparent;font:500 13.5px/1 Onest;color:var(--muted);text-align:left}
.nav button.on{border-color:var(--navOnBd);background:var(--navOnBg);box-shadow:var(--navOnSh);font-weight:600;color:var(--ink)}
.nav .n{font:500 12px/1 Onest;opacity:.6}
.norm{padding:16px;border-radius:20px;background:var(--panelBg);border:1px solid var(--cardBd);box-shadow:var(--shCard)}
.norm h3{font:500 12px/1 Onest;color:var(--muted)}
.norm .big{margin-top:11px;font:700 32px/1 Onest;color:var(--ink);letter-spacing:-.02em}
.norm .big small{font:500 14px/1 Onest;color:var(--muted);margin-left:6px}
.track{margin-top:12px;height:8px;border-radius:6px;background:var(--trackBg);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:var(--progBg);box-shadow:var(--shGlow)}
.railnote{font:400 12px/1.5 Onest;color:var(--muted);padding:0 4px}
.railnote b{color:var(--warn);font-weight:600}

/* ── полотно ─────────────────────────────────────────────────────── */
.pane{display:none}
.pane.on{display:block}
.head{display:flex;align-items:flex-end;gap:14px;padding:20px 24px 16px}
.head h1{font:700 22px/1.2 Onest;color:var(--ink);letter-spacing:-.02em}
.head .sub{margin-top:4px;font:400 13px/1 Onest;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(216px,1fr));gap:14px;align-items:start;padding:0 24px 28px}
.col{background:var(--colBg);border:1px solid var(--hairline);border-radius:22px;padding:12px 12px 14px}
.col.over{outline:1.5px dashed var(--accent);outline-offset:-4px}
.colhead{display:flex;justify-content:space-between;padding:2px 6px 11px;font:600 13px/1 Onest;color:var(--ink2)}
.colhead span{color:var(--muted);font-weight:500}
.card{background:var(--cardBg);border:1px solid var(--cardBd);border-radius:16px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shCard);cursor:grab}
.card:last-child{margin-bottom:0}
.card.dragging{opacity:.45}
.card.flag{border-color:var(--warnBd)}
.card .t{font:600 13.5px/1.35 Onest;color:var(--ink);text-wrap:pretty}
.card .ins{margin-top:7px;font:500 12px/1.4 Onest;color:var(--ink2);border-left:2px solid var(--accentSoft);padding-left:9px}
.card .src{margin-top:7px;font:400 11.5px/1.4 Onest;color:var(--muted)}
.row{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font:500 11px/1 Onest;padding:5px 9px;border-radius:8px;background:var(--chipBg);color:var(--muted)}
.tag.pl{background:var(--accentSoft);color:var(--accent);box-shadow:var(--shTag)}
.tag.auto{background:var(--okSoft);color:var(--ok)}
.tag.no-mark{background:var(--warnSoft);color:var(--warn)}
.tag.warnish{background:var(--accentSoft);color:var(--accent)}
.rows{display:flex;flex-direction:column;gap:10px;padding:0 24px 28px;max-width:900px}
.row-item{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:18px;background:var(--cardBg);border:1px solid var(--cardBd);box-shadow:var(--shCard);flex-wrap:wrap}
.row-item .grow{flex:1;min-width:160px}
.row-item .t{font:600 14px/1 Onest;color:var(--ink)}
.row-item .m{margin-top:5px;font:400 12px/1.35 Onest;color:var(--muted)}
.pill{font:500 11.5px/1 Onest;padding:6px 11px;border-radius:9px;background:var(--chipBg);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.pill.warn{background:var(--warnSoft);color:var(--warn)}
.mini{padding:9px 15px;border:1px solid var(--inputBg);border-radius:12px;background:var(--cardBd);font:600 12.5px/1 Onest;color:var(--ink2);white-space:nowrap}
.mini.danger{color:var(--warn)}
.ideas{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;align-items:start;padding:0 24px 28px;max-width:1100px}
.idea{padding:16px 17px;border-radius:18px;background:var(--cardBg);border:1px solid var(--cardBd);box-shadow:var(--shCard);cursor:pointer}
.idea .k{font:600 11px/1 Onest;color:var(--accent);letter-spacing:.02em}
.idea .ins{margin-top:9px;padding-left:10px;border-left:2px solid var(--accentSoft);font:500 12.5px/1.45 Onest;color:var(--ink2)}
.idea p{margin:8px 0 0;font:400 13.5px/1.5 Onest;color:var(--ink);text-wrap:pretty}
.idea.done{background:var(--mutedCardBg);border-color:var(--chipBg);box-shadow:none}
.idea.done .k,.idea.done p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.stat{padding:18px;border-radius:20px;background:var(--cardBg);border:1px solid var(--cardBd)}
.stat b{display:block;font:700 32px/1.1 Onest;color:var(--ink);letter-spacing:-.02em}
.stat span{font:400 12.5px/1.3 Onest;color:var(--muted)}
.stat.alert{border-color:var(--warnBd)}
.stat.alert b{color:var(--warn)}
.chart{margin-top:16px;padding:20px;border-radius:22px;background:var(--panelBg);border:1px solid var(--cardBd)}
.chart h3{font:600 15px/1 Onest;color:var(--ink)}
.chart .sub{margin-top:6px;font:400 12.5px/1.4 Onest;color:var(--muted)}
.chart .rows{padding:0;max-width:none;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:7px;height:150px;margin-top:18px}
.bars i{flex:1;border-radius:7px;background:var(--barBg);box-shadow:var(--shBar);display:block;min-height:4px}
.bars i.low{background:var(--barLow);box-shadow:none}
.days{display:flex;gap:7px;margin-top:8px}
.days span{flex:1;text-align:center;font:400 10.5px/1 Onest;color:var(--muted);overflow:hidden}
.empty{padding:24px 6px;font:400 13px/1.5 Onest;color:var(--muted);max-width:460px}
#p-stats,#p-ideas{padding:0 24px 28px}
#p-ideas .ideas,#p-stats .stats{padding:0}
#p-ideas .row{padding:0;margin:0 0 14px}

/* ── окна: тот же материал, что панель отбора в макете ───────────── */
.veil{position:fixed;inset:0;z-index:40;background:rgba(20,16,10,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.veil.on{display:flex}
.win{width:100%;max-width:520px;border-radius:26px;border:1px solid var(--panelBd);background:var(--panelBlur);backdrop-filter:blur(18px);box-shadow:var(--shPanel);padding:22px 22px 24px}
.win{position:relative}
.wclose{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;
  border:1px solid var(--cardBd);background:var(--chipBg);color:var(--ink2);font:600 15px/1 Onest;z-index:2}
.win h2{padding-right:46px;font:700 20px/1 Onest;color:var(--ink);letter-spacing:-.02em}
.win .lead{margin-top:8px;font:400 13px/1.5 Onest;color:var(--muted)}
.field{margin-top:18px}
.field label{display:block;font:600 13.5px/1 Onest;color:var(--ink);margin-bottom:10px}
.field input,.field select,.field textarea{width:100%;padding:13px 16px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);box-shadow:var(--shCard);font:500 13.5px/1.3 Onest;color:var(--ink2);outline:none}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wbtns{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap;align-items:center}
.note{margin-top:10px;font:400 12px/1.5 Onest;color:var(--muted)}
.danger{color:var(--warn)}
.copy{width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);font:500 12.5px/1.4 Onest;color:var(--ink2);word-break:break-all;text-align:left;cursor:copy}
.plist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.pchk{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--sunkBg);border:1px solid var(--cardBd);font:500 13.5px/1 Onest;color:var(--ink2);cursor:pointer}
.rule-row{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:14px;background:var(--sunkBg);border:1px solid var(--cardBd);margin-top:9px;flex-wrap:wrap}
.rule-row .grow{flex:1;min-width:150px;font:500 13px/1.3 Onest;color:var(--ink2)}

/* ── пин и уведомление ───────────────────────────────────────────── */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--pageBg)}
.gate .box{width:300px;padding:24px;border-radius:26px;border:1px solid var(--panelBd);background:var(--panelBlur);box-shadow:var(--shPanel);text-align:center}
.gate h2{font:700 20px/1 Onest;color:var(--ink);margin-bottom:16px}
.gate input{width:100%;padding:13px;border-radius:14px;background:var(--inputBg);border:1px solid var(--inputBd);text-align:center;letter-spacing:.3em;font:500 15px/1 Onest;color:var(--ink);outline:none}
.gate .err{margin-top:10px;font:400 12px/1.4 Onest;color:var(--warn);min-height:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;padding:13px 20px;border-radius:14px;background:var(--btnBg);color:var(--btnFg);font:600 13px/1 Onest;box-shadow:var(--shBtn);display:none}
.toast.on{display:block}
.hide{display:none!important}
.mnav{display:none}

@media (max-width:900px){
  .page{padding:0}
  .frame{min-width:0;border-radius:0;border:0;box-shadow:none;min-height:100vh}
  .grid{grid-template-columns:1fr;min-height:0}
  .rail{display:none}
  .top{padding:calc(12px + var(--safe-top)) 14px 12px;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--winBg)}
  .mnav{display:flex;gap:7px;padding:10px 14px 0;overflow:auto}
  .mnav button{padding:9px 15px;border-radius:12px;border:1px solid var(--cardBd);background:var(--chipBg);font:500 13px/1 Onest;color:var(--muted);white-space:nowrap}
  .mnav button.on{border-color:var(--navOnBd);background:var(--navOnBg);box-shadow:var(--navOnSh);color:var(--ink);font-weight:600}
  .head{padding:16px 14px 12px}
  .board,.rows,.ideas,#p-stats,#p-ideas{padding-left:14px;padding-right:14px}
  .board{grid-template-columns:1fr}
  .ideas{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .hide-mob{display:none}
  .win{padding:20px;border-radius:22px}
  .veil{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── этапы и подвкладки (v8) ───────────────────────────────────────── */
.stages{display:flex;gap:6px;padding:12px 22px 0;overflow:auto}
.stages button{padding:10px 16px;border-radius:13px 13px 0 0;border:1px solid transparent;border-bottom:0;
  background:transparent;font:600 13.5px/1 Onest;color:var(--muted);white-space:nowrap}
.stages button.on{color:var(--ink);background:var(--cardBg);border-color:var(--cardBd)}
.stages .n{margin-left:8px;font-weight:500;opacity:.65}
.subs{display:flex;gap:7px;padding:12px 22px 0;overflow:auto;border-top:1px solid var(--hairline)}
.subs button{padding:8px 14px;border-radius:11px;border:1px solid var(--cardBd);background:var(--chipBg);
  font:500 13px/1 Onest;color:var(--muted);white-space:nowrap}
.subs button.on{border-color:var(--navOnBd);background:var(--navOnBg);box-shadow:var(--navOnSh);color:var(--ink);font-weight:600}
.subs .n{margin-left:7px;opacity:.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:0 22px 100px}
.pcard{background:var(--cardBg);border:1px solid var(--cardBd);border-radius:16px;box-shadow:var(--shCard);padding:13px 14px}
.pcard.picked{border-color:var(--accent)}
.pcard.flag{border-color:var(--warnBd)}
.pcard .top2{display:flex;gap:10px;align-items:flex-start}
.pcard .t{flex:1;font:600 13.5px/1.35 Onest;cursor:pointer}
.pcard .ins{margin-top:8px;padding-left:9px;border-left:2px solid var(--accentSoft);font:500 12px/1.4 Onest;color:var(--ink2)}
.pcard .src{margin-top:7px;font:400 11.5px/1.4 Onest;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.acts button{padding:7px 11px;border-radius:10px;border:1px solid var(--cardBd);background:var(--chipBg);
  font:600 11.5px/1 Onest;color:var(--ink2)}
.acts button.go{background:var(--btnBg);color:var(--btnFg);border-color:transparent}
.acts button.danger{color:var(--warn)}
.bulk{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:none;
  gap:8px;align-items:center;padding:11px 14px;border-radius:16px;border:1px solid var(--panelBd);
  background:var(--panelBlur);backdrop-filter:blur(18px);box-shadow:var(--shPanel);flex-wrap:wrap;max-width:94vw}
.bulk.on{display:flex}
.bulk b{font:700 13px/1 Onest;padding-right:4px}
.stub{padding:26px 22px;font:400 13.5px/1.6 Onest;color:var(--muted);max-width:560px}
@media (max-width:900px){
  .stages,.subs{padding-left:14px;padding-right:14px}
  .cards{grid-template-columns:1fr;padding:0 14px 120px}
}
</style>
</head>
<body>

<div class="page">
  <div class="shaft"></div>
  <div class="leak" id="leak1"></div><div class="leak" id="leak2"></div>
  <div class="leak" id="leak3"></div><div class="leak" id="leak4"></div>

  <div class="frame hide" id="shell">
    <div class="leak" id="leak5"></div><div class="leak" id="leak6"></div><div class="leak" id="leak7"></div>

    <header class="top">
      <div class="brand"><div class="mark"><i></i></div><b>Контент-завод</b></div>
      <input class="search hide-mob" id="q" placeholder="Поиск по единицам и занятиям">
      <div class="spacer hide-mob"></div>
      <button class="iconbtn" id="theme" aria-label="Тема">☾</button>
      <button class="primary" id="newbtn">Новая единица</button>
    </header>

    <nav class="stages" id="stages"></nav>
    <nav class="subs" id="subs"></nav>

    <div class="head">
      <div><h1 id="ttl">Сырьё</h1><div class="sub" id="sub">загружаю…</div></div>
    </div>

    <div id="view"></div>
  </div>
</div>

<div class="bulk" id="bulk"></div>

<div class="gate" id="gate">
  <div class="box">
    <h2>Контент-завод</h2>
    <input id="pin" type="password" inputmode="numeric" enterkeyhint="go" placeholder="пин" autocomplete="off">
    <button class="primary" id="pinbtn" style="width:100%;margin-top:12px">Войти</button>
    <div class="err" id="pinerr"></div>
  </div>
</div>

<div class="veil" id="veil"><div class="win" id="win"></div></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  КОНТЕНТ-ЗАВОД — экран на ручках app/factory.py
//
//  ⚠️ ЭТАПЫ — ВЕРХНИЙ УРОВЕНЬ, вкладки внутри них. [stated] Denis 12.09.2026:
//  «этапы это вкладки над вкладками». Раньше всё висело в одном ряду, и
//  «Сырьё» стояло рядом с «Числами», хотя это разные комнаты завода.
// ═══════════════════════════════════════════════════════════════════
var API = 'https://api.youselllikeagod-magazine.ru';
var KEY = '';
var S = {pieces:[], ideas:[], rules:[], raw:[], dict:{}};
var STATS = null, THEMES = [];
var PICK = {};              // отмеченные галочками
var EDIT = null;

var MAP = {
  raw:     {label:'Сырьё',     subs:[['lectures','Занятия'],['ideas','Идеи']]},
  process: {label:'Обработка', subs:[['video_short','Видео'],['carousel','Карусели'],['text','Посты'],['shoot','Идеи для съёмки']]},
  "export":{label:'Экспорт',   subs:[['ready','Готово к выдаче'],['settings','Настройки']]},
  post:    {label:'Постинг',   subs:[['queue','Очередь'],['accounts','Площадки']]},
  report:  {label:'Отчёт',     subs:[['numbers','Числа'],['rules','Правила']]}
};
var STAGE = 'raw', SUB = 'lectures';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); },2200); }
function label(list, key){ list=list||[]; for (var i=0;i<list.length;i++) if (list[i].key===key) return list[i].label; return key||''; }

function api(path, opts){
  opts = opts || {};
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  return fetch(API + path + sep + 'x_admin_token=' + encodeURIComponent(KEY), {
    method: opts.method || 'GET',
    headers: opts.body ? {'Content-Type':'application/json'} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if (!r.ok) throw new Error((d && d.detail) || ('сервер ответил ' + r.status));
      return d;
    });
  });
}

/* ── вход ────────────────────────────────────────────────────────── */
function tryLogin(){
  var pin = $('pin').value.trim();
  if (!pin) { $('pinerr').textContent = 'Введи пин'; return; }
  $('pinerr').textContent = ''; $('pinbtn').disabled = true; $('pinbtn').textContent = 'Проверяю…';
  fetch(API + '/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pin:pin})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if (!res.ok) throw new Error((res.d && res.d.detail) || 'не пускает');
      KEY = res.d.token || res.d.key || pin;
      try { sessionStorage.setItem('factory_key', KEY); } catch(e){}
      $('gate').classList.add('hide'); $('shell').classList.remove('hide'); load();
    })
    .catch(function(e){ $('pinerr').textContent = e.message; $('pinbtn').disabled = false; $('pinbtn').textContent = 'Войти'; });
}
$('pinbtn').addEventListener('click', tryLogin);
$('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
try { var saved = sessionStorage.getItem('factory_key');
  if (saved) { KEY = saved; $('gate').classList.add('hide'); $('shell').classList.remove('hide'); } } catch(e){}

/* ── загрузка ────────────────────────────────────────────────────── */
function load(){
  return api('/factory/state').then(function(d){
    S = d; PICK = {}; nav(); render();
    return api('/factory/stats?days=30');
  }).then(function(s){ STATS = s; if (STAGE === 'report') render(); })
    .catch(function(e){ $('sub').textContent = 'не открылось: ' + e.message; });
}

/* ── что где лежит ───────────────────────────────────────────────── */
function live(){ return S.pieces.filter(function(p){ return p.status !== 'dropped'; }); }
function atStage(st){ return live().filter(function(p){ return (p.stage || 'process') === st; }); }

function bySub(list, sub){
  // ⚠️ «Идеи для съёмки» — не формат, а короткое видео без записи и без
  // ответа: снимать надо самому. Отдельная вкладка нужна именно потому, что
  // работа с ними другая — их не экспортируешь, их снимают
  if (sub === 'shoot') return list.filter(function(p){ return p.fmt === 'video_short' && !p.lecture_slug; });
  if (sub === 'video_short') return list.filter(function(p){ return p.fmt === 'video_short' && p.lecture_slug; });
  return list.filter(function(p){ return p.fmt === sub; });
}

function subCount(stage, sub){
  if (stage === 'raw') return sub === 'lectures' ? S.raw.length : S.ideas.filter(function(i){ return i.status === 'open'; }).length;
  if (stage === 'process') return bySub(atStage('process'), sub).length;
  if (stage === 'export') return sub === 'ready' ? atStage('export').length : 0;
  if (stage === 'post') return sub === 'queue' ? atStage('post').length : 0;
  return 0;
}
function stageCount(st){
  if (st === 'raw') return S.raw.filter(function(r){ return !r.pieces; }).length;
  if (st === 'report') return 0;
  return atStage(st === 'export' ? 'export' : st).length;
}

/* ── навигация ───────────────────────────────────────────────────── */
function nav(){
  $('stages').innerHTML = Object.keys(MAP).map(function(k){
    var n = stageCount(k);
    return '<button data-st="' + k + '" class="' + (k === STAGE ? 'on' : '') + '">' + esc(MAP[k].label) +
           (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
  $('subs').innerHTML = MAP[STAGE].subs.map(function(s){
    var n = subCount(STAGE, s[0]);
    return '<button data-sub="' + s[0] + '" class="' + (s[0] === SUB ? 'on' : '') + '">' + esc(s[1]) +
           (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
  var a = $('stages').querySelectorAll('[data-st]');
  for (var i=0;i<a.length;i++) (function(b){ b.addEventListener('click', function(){
    STAGE = b.dataset.st; SUB = MAP[STAGE].subs[0][0]; PICK = {}; nav(); render(); }); })(a[i]);
  var c2 = $('subs').querySelectorAll('[data-sub]');
  for (var j=0;j<c2.length;j++) (function(b){ b.addEventListener('click', function(){
    SUB = b.dataset.sub; PICK = {}; nav(); render(); }); })(c2[j]);
  $('ttl').textContent = MAP[STAGE].label;
}

/* ── карточка единицы ────────────────────────────────────────────── */
function pcard(p){
  var src = p.lecture_slug ? ('Занятие «' + esc(p.lecture_slug) + '»' + (p.timecode ? ' · ' + esc(p.timecode) : ''))
                           : 'Без привязки к занятию';
  var tags = '<span class="tag pl">' + esc(p.fmt_label) + '</span><span class="tag">' + esc(p.platform_label) + '</span>' +
             (p.no_mark ? '<span class="tag no-mark">без метки</span>' : '') +
             (p.pending_post ? '<span class="tag warnish">забрал, не выложил</span>' : '');
  var вперёд = STAGE === 'process' ? 'Подходит' : (STAGE === 'export' ? 'В постинг' : 'Готово');
  return '<div class="pcard' + (PICK[p.id] ? ' picked' : '') + (p.no_mark ? ' flag' : '') + '" data-card="' + p.id + '">' +
    '<div class="top2"><input type="checkbox" data-pick="' + p.id + '"' + (PICK[p.id] ? ' checked' : '') + '>' +
    '<div class="t" data-open="' + p.id + '">' + esc(p.title || 'без названия') + '</div></div>' +
    (p.insight ? '<div class="ins">' + esc(p.insight) + '</div>' : '') +
    '<div class="src">' + src + '</div>' +
    '<div class="row">' + tags + '</div>' +
    '<div class="acts">' +
      '<button class="go" data-act="approve" data-id="' + p.id + '">' + вперёд + '</button>' +
      '<button data-open="' + p.id + '">Править</button>' +
      '<button data-act="type" data-id="' + p.id + '">Тип</button>' +
      '<button data-act="duplicate" data-id="' + p.id + '">Дублировать</button>' +
      '<button class="danger" data-act="drop" data-id="' + p.id + '">Удалить</button>' +
    '</div></div>';
}

function wireCards(){
  var box = $('view');
  var op = box.querySelectorAll('[data-open]');
  for (var i=0;i<op.length;i++) (function(b){ b.addEventListener('click', function(e){
    e.stopPropagation(); openPiece(Number(b.dataset.open)); }); })(op[i]);
  var pk = box.querySelectorAll('[data-pick]');
  for (var j=0;j<pk.length;j++) (function(b){ b.addEventListener('change', function(){
    var id = Number(b.dataset.pick);
    if (b.checked) PICK[id] = true; else delete PICK[id];
    render();
  }); })(pk[j]);
  var ac = box.querySelectorAll('[data-act]');
  for (var k=0;k<ac.length;k++) (function(b){ b.addEventListener('click', function(e){
    e.stopPropagation(); doBulk(b.dataset.act, [Number(b.dataset.id)]); }); })(ac[k]);
}

/* ── массовые действия ───────────────────────────────────────────── */
function picked(){ return Object.keys(PICK).map(Number); }

function doBulk(action, ids){
  ids = ids || picked();
  if (!ids.length) { toast('Ничего не отмечено'); return; }
  if (action === 'type') { openType(ids); return; }
  if (action === 'export') { doExport(ids); return; }
  api('/factory/pieces/bulk', {method:'POST', body:{ids:ids, action:action}})
    .then(function(r){
      (r.pieces || []).forEach(replace);
      (r.created || []).forEach(function(c){ S.pieces.unshift(c); });
      PICK = {}; nav(); render();
      toast(action === 'approve' ? 'Отправлено дальше' : (action === 'drop' ? 'Убрано' : 'Готово'));
    }).catch(function(e){ toast(e.message); });
}

function openType(ids){
  openWin('<h2>Сменить тип</h2><div class="lead">Единиц: ' + ids.length + '</div>' +
    '<div class="field"><label>Новый тип</label><select id="ty">' +
      (S.dict.formats || []).map(function(f){ return '<option value="' + f.key + '">' + esc(f.label) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="wbtns"><button class="ghost" data-x="close">Отмена</button><div class="spacer"></div>' +
    '<button class="primary" data-x="type-go" data-ids="' + ids.join(',') + '">Сменить</button></div>');
}

function bulkBar(){
  var n = picked().length;
  var bar = $('bulk');
  if (!n || STAGE === 'raw' || STAGE === 'report') { bar.classList.remove('on'); bar.innerHTML = ''; return; }
  var вперёд = STAGE === 'process' ? 'Подходит' : (STAGE === 'export' ? 'В постинг' : 'Готово');
  bar.innerHTML = '<b>' + n + '</b>' +
    '<button class="primary" data-b="approve">' + вперёд + '</button>' +
    (STAGE === 'export' ? '<button class="ghost" data-b="export">Экспорт</button>' : '') +
    '<button class="ghost" data-b="type">Тип</button>' +
    '<button class="ghost" data-b="duplicate">Дублировать</button>' +
    '<button class="ghost" data-b="back">Назад</button>' +
    '<button class="ghost danger" data-b="drop">Удалить</button>' +
    '<button class="ghost" data-b="none">Снять</button>';
  bar.classList.add('on');
  var bs = bar.querySelectorAll('[data-b]');
  for (var i=0;i<bs.length;i++) (function(b){ b.addEventListener('click', function(){
    if (b.dataset.b === 'none') { PICK = {}; render(); return; }
    doBulk(b.dataset.b);
  }); })(bs[i]);
}

function replace(p){
  for (var i=0;i<S.pieces.length;i++) if (S.pieces[i].id === p.id) { S.pieces[i] = p; return; }
  S.pieces.unshift(p);
}

/* ── отрисовка ───────────────────────────────────────────────────── */
function render(){
  var v = $('view');
  var q = ($('q').value || '').trim().toLowerCase();
  function hit(p){ return !q || (p.title||'').toLowerCase().indexOf(q) >= 0 || (p.lecture_slug||'').toLowerCase().indexOf(q) >= 0; }

  if (STAGE === 'raw' && SUB === 'lectures') { renderRaw(q); }
  else if (STAGE === 'raw') { renderIdeas(); }
  else if (STAGE === 'process' || STAGE === 'export' || STAGE === 'post') {
    if (STAGE === 'export' && SUB === 'settings') { renderSettings(); }
    else if (STAGE === 'post' && SUB === 'accounts') {
      v.innerHTML = '<div class="stub">Площадок пока нет. Здесь появятся аккаунты и расписание: сначала те, куда можно постить по API — Телеграм и ВК, — а Инстаграм и TikTok останутся ручными, там публикация с телефона даёт больше охвата.</div>';
    } else {
      var list = (STAGE === 'process' ? bySub(atStage('process'), SUB) : atStage(STAGE)).filter(hit);
      v.innerHTML = list.length
        ? '<div class="cards">' + list.map(pcard).join('') + '</div>'
        : '<div class="stub">Пусто. ' + (STAGE === 'process'
            ? 'Разбери занятие на вкладке «Сырьё» — заготовки появятся здесь сами.'
            : 'Сюда попадает то, что ты отметил «Подходит».') + '</div>';
      wireCards();
    }
  }
  else { renderReport(); }

  var n = STAGE === 'raw' ? subCount('raw', SUB) : (STAGE === 'report' ? 0 : atStage(STAGE).length);
  $('sub').textContent = MAP[STAGE].subs.filter(function(s){ return s[0] === SUB; })[0][1] +
    (n ? ' · ' + n : '');
  bulkBar();
}

function renderRaw(q){
  var rows = S.raw.filter(function(r){
    return !q || (r.title||'').toLowerCase().indexOf(q) >= 0 || (r.slug||'').toLowerCase().indexOf(q) >= 0;
  });
  if (!rows.length) { $('view').innerHTML = '<div class="stub">Занятий не нашлось.</div>'; return; }
  $('view').innerHTML = '<div class="rows">' + rows.map(function(r){
    var meta = [];
    if (r.stream_title) meta.push('Поток «' + esc(r.stream_title) + '»');
    if (r.duration_minutes) meta.push(r.duration_minutes + ' мин');
    meta.push(r.insights ? (r.insights + ' мыслей, ' + r.insights_main + ' главных') : 'мыслей нет');
    return '<div class="row-item"><div class="grow"><div class="t">' + esc(r.title || r.slug) + '</div>' +
      '<div class="m">' + meta.join(' · ') + '</div></div>' +
      (r.pieces ? '<span class="pill ok">' + r.pieces + ' ед.</span>' : '<span class="pill warn">не разобрано</span>') +
      '<button class="mini" data-proc="' + esc(r.slug) + '">Разобрать</button>' +
      '<button class="mini" data-new="' + esc(r.slug) + '">Вручную</button></div>';
  }).join('') + '</div>';
  var pr = $('view').querySelectorAll('[data-proc]');
  for (var i=0;i<pr.length;i++) (function(b){ b.addEventListener('click', function(){ processLecture(b.dataset.proc); }); })(pr[i]);
  var nw = $('view').querySelectorAll('[data-new]');
  for (var j=0;j<nw.length;j++) (function(b){ b.addEventListener('click', function(){ openPiece(null, b.dataset.new); }); })(nw[j]);
}

function renderIdeas(){
  var list = S.ideas;
  if (!list.length) { $('view').innerHTML = '<div class="stub">Идей пока нет. Разбери занятие — мысли станут идеями.</div>'; return; }
  $('view').innerHTML = '<div class="cards">' + list.map(function(i){
    var rc = i.route === 'clip' ? 'auto' : (i.route === 'answered' ? 'pl' : '');
    return '<div class="pcard' + (i.status === 'dropped' ? ' done' : '') + '">' +
      '<div class="top2"><div class="t" data-idea="' + i.id + '">' + esc(i.body) + '</div></div>' +
      (i.answer ? '<div class="ins">' + esc(i.answer) + '</div>' : '') +

function touchLabel(n){ return STATS && STATS.touches_measured ? (n + ' переходов') : 'переходы не считаются'; }

function cutBlock(title, rows){
  if (!rows || !rows.length) return '';
  return '<div class="chart"><h3>' + title + '</h3>' +
    '<div class="sub">Отсюда правятся правила производства — по факту, а не по ощущению</div>' +
    '<div class="rows">' + rows.map(function(r){
      return '<div class="row-item"><div class="grow"><div class="t">' + esc(r.label || r.key || 'без вида') + '</div>' +
        '<div class="m">' + r.pieces + ' выложено</div></div>' +
        '<span class="pill">' + touchLabel(r.touches) + '</span>' +
        '<span class="pill">' + r.came + ' пришло</span>' +
        '<span class="pill' + (r.paid ? ' ok' : '') + '">' + r.paid + ' оплат</span></div>';
    }).join('') + '</div></div>';
}

function renderReport(){
  if (SUB === 'rules') { renderRulesPane(); return; }
  if (!STATS) { $('view').innerHTML = '<div class="stub">Считаю…</div>'; return; }
  var max = 1;
  for (var i=0;i<STATS.series.length;i++) if (STATS.series[i].count > max) max = STATS.series[i].count;
  var bars = STATS.series.map(function(d){
    return '<i class="' + (d.low ? 'low' : '') + '" style="height:' + Math.round(d.count * 100 / max) + '%"></i>';
  }).join('');
  var days = STATS.series.map(function(d){ return '<span>' + d.date.slice(8) + '</span>'; }).join('');
  $('view').innerHTML = '<div class="rows">' +
    '<div class="stats">' +
      '<div class="stat"><b>' + STATS.published_period + '</b><span>выложено за 30 дней</span></div>' +
      '<div class="stat"><b>' + STATS.in_queue + '</b><span>в работе</span></div>' +
      '<div class="stat' + (STATS.no_mark ? ' alert' : '') + '"><b>' + STATS.no_mark + '</b><span>выложено без метки</span></div>' +
      '<div class="stat"><b>' + (STATS.pending_post || 0) + '</b><span>забрал, не выложил</span></div>' +
      '<div class="stat' + (STATS.lectures_unworked ? ' alert' : '') + '"><b>' + STATS.lectures_unworked + '</b><span>занятий без единиц</span></div>' +
    '</div>' +
    '<div class="chart"><h3>Выложено по дням</h3>' +
      '<div class="sub">Серым — дни ниже нормы в ' + STATS.norm + ' единиц</div>' +
      '<div class="bars">' + bars + '</div><div class="days">' + days + '</div></div>' +

}

function doExport(ids){
  // ⚠️ Экспорт зависит от типа, поэтому пачкой берём только однотипное:
  // карусель рисуется картинками, пост отдаётся текстом, видео пока никак
  var list = ids.map(function(id){ return pieceById(id); }).filter(Boolean);
  var типы = {}; list.forEach(function(p){ типы[p.fmt] = true; });
  if (Object.keys(типы).length > 1) { toast('Отметь единицы одного типа — экспорт у них разный'); return; }
  var fmt = list[0].fmt;
  if (fmt === 'carousel') { openCarousel(list[0]); return; }
  if (fmt === 'text') {
    openWin('<h2>Текст для публикации</h2><div class="lead">' + esc(list[0].title) + '</div>' +
      '<div class="field"><textarea id="tx" style="min-height:280px">' + esc(list[0].note || list[0].insight) + '</textarea></div>' +

      '<button class="primary" data-x="copy-text">Скопировать</button></div>');

/* ── действия окон ───────────────────────────────────────────────── */
function act(what){
  if (what === 'close') { closeWin(); return; }

  if (what === 'save') {
    api('/factory/piece', {method:'POST', body:{
      id: EDIT ? EDIT.id : null, title: $('f-title').value, note: $('f-note').value,
      fmt: $('f-fmt').value, platform: $('f-pl').value, status: EDIT ? EDIT.status : 'idea',
      lecture_slug: $('f-slug').value.trim(), timecode: $('f-tc').value.trim(),
      insight: $('f-ins').value.trim()
    }}).then(function(r){ replace(r.piece); closeWin(); nav(); render(); toast('Сохранено'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'draft') {
    var btn = $('win').querySelector('[data-x="draft"]');
    if (btn) { btn.textContent = 'Пишу…'; btn.disabled = true; }
    api('/factory/piece', {method:'POST', body:{
      id: EDIT.id, title: $('f-title').value, note: $('f-note').value, fmt: $('f-fmt').value,
      platform: $('f-pl').value, status: EDIT.status, lecture_slug: $('f-slug').value.trim(),
      timecode: $('f-tc').value.trim(), insight: $('f-ins').value.trim()
    }})
      .then(function(r){ replace(r.piece); EDIT = r.piece;
        return api('/factory/piece/' + EDIT.id + '/draft', {method:'POST', body:{save:true}}); })
      .then(function(r){ replace(r.piece); EDIT = r.piece; openPiece(EDIT.id); render(); toast('Черновик готов'); })
      .catch(function(e){ toast(e.message); if (btn) { btn.textContent = 'Написать черновик'; btn.disabled = false; } });
    return;
  }
  if (what === 'publish') { openPublish(); return; }
  if (what === 'pub-go') {
    api('/factory/piece/' + EDIT.id + '/publish', {method:'POST', body:{
      url: $('f-url').value.trim(), code: $('f-code').value.trim(), published_at: $('f-date').value.trim()
    }}).then(function(r){
      replace(r.piece); nav(); render();
      openWin('<h2>Выложено</h2><div class="lead">Метка ' + esc(r.piece.source_code) + ' заведена</div>' +
        '<button class="copy" data-x="copy" data-link="' + esc(r.deeplink) + '">' + esc(r.deeplink) + '</button>' +
        '<div class="note">Нажми, чтобы скопировать.</div>' +
        '<div class="wbtns"><div class="spacer"></div><button class="primary" data-x="close">Готово</button></div>');
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'copy') {
    var link = $('win').querySelector('[data-link]').dataset.link;
    if (navigator.clipboard) navigator.clipboard.writeText(link);
    toast('Ссылка скопирована'); return;
  }
  if (what === 'copy-text') {
    if (navigator.clipboard) navigator.clipboard.writeText($('tx').value);
    toast('Текст скопирован'); return;
  }
  if (what === 'taken') {
    api('/factory/piece/' + EDIT.id + '/taken', {method:'POST', body:{taken: !EDIT.taken}})
      .then(function(r){ replace(r.piece); EDIT = r.piece; openPiece(EDIT.id); render();
        toast(r.piece.taken ? 'Файл на телефоне' : 'Отметка снята'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'spread') { openSpread(); return; }
  if (what === 'spread-go') {
    var picked2 = [];
    var boxes = $('win').querySelectorAll('input[type=checkbox]');
    for (var i=0;i<boxes.length;i++) if (boxes[i].checked) picked2.push(boxes[i].value);
    if (!picked2.length) { toast('Ни одной площадки не выбрано'); return; }
    api('/factory/piece/' + EDIT.id + '/spread', {method:'POST', body:{platforms:picked2}})
      .then(function(r){ (r.created||[]).forEach(function(c){ S.pieces.unshift(c); });
        closeWin(); nav(); render(); toast(r.created.length ? ('Создано: ' + r.created.length) : 'Такие уже есть'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'type-go') {
    var ids = $('win').querySelector('[data-x="type-go"]').dataset.ids.split(',').map(Number);
    api('/factory/pieces/bulk', {method:'POST', body:{ids:ids, action:'fmt', value:$('ty').value}})
      .then(function(r){ (r.pieces||[]).forEach(replace); PICK = {}; closeWin(); nav(); render(); toast('Тип сменён'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'car-go') {
    var id = Number($('win').querySelector('[data-x="car-go"]').dataset.id);
    var th = $('th') ? $('th').value : '';
    toast('Собираю картинки…');
    api('/factory/piece/' + id + '/carousel', {method:'POST', body:{theme:th}})
      .then(function(r){
        replace(r.piece);
        openWin('<h2>Карусель готова</h2><div class="lead">Экранов: ' + r.assets.length + '</div>' +
          r.assets.map(function(u,n){ return '<button class="copy" data-x="none">' + (n+1) + ' · ' + esc(u) + '</button>'; }).join('') +
          '<div class="wbtns"><div class="spacer"></div><button class="primary" data-x="close">Готово</button></div>');
      }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'idea-save') {
    api('/factory/idea', {method:'POST', body:{
      id: EDIT ? EDIT.id : null, kind: $('i-kind').value, body: $('i-body').value,
      answer: $('i-answer').value, source: $('i-src').value, timecode: $('i-tc').value.trim(),
      lecture_slug: $('i-slug').value.trim(), status: EDIT ? EDIT.status : 'open'
    }}).then(function(r){
      var found = false;
      for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === r.idea.id) { S.ideas[i] = r.idea; found = true; }
      if (!found) S.ideas.unshift(r.idea);
      closeWin(); nav(); render();
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'idea-make') {
    api('/factory/idea/' + EDIT.id + '/make', {method:'POST', body:{platform:'tg'}})
      .then(function(r){ (r.created||[]).forEach(function(c){ S.pieces.unshift(c); });
        for (var j=0;j<S.ideas.length;j++) if (S.ideas[j].id === r.idea.id) S.ideas[j] = r.idea;
        closeWin(); nav(); render(); toast(r.created.length ? ('В обработке: ' + r.created.length) : 'Уже развёрнута'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'idea-drop') {
    api('/factory/idea/' + EDIT.id, {method:'DELETE'})
      .then(function(r){ for (var i=0;i<S.ideas.length;i++) if (S.ideas[i].id === r.idea.id) S.ideas[i] = r.idea;
        closeWin(); nav(); render(); }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'rule-save') {
    api('/factory/rule', {method:'POST', body:{
      id: EDIT ? EDIT.id : null, title_tpl: $('r-tpl').value, fmt: $('r-fmt').value,
      platform: $('r-pl').value, stream_key: $('r-stream').value.trim(), active: true
    }}).then(function(r){
      var found = false;
      for (var i=0;i<S.rules.length;i++) if (S.rules[i].id === r.rule.id) { S.rules[i] = r.rule; found = true; }
      if (!found) S.rules.push(r.rule);
      closeWin(); renderRules();
    }).catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'theme-save') {
    api('/factory/theme', {method:'POST', body:{
      key: EDIT ? EDIT.key : $('t-key').value, title: $('t-title').value, css: $('t-css').value
    }}).then(function(){ closeWin(); renderThemes(); toast('Тема сохранена'); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'gen-go') {
    api('/factory/generate', {method:'POST', body:{dry_run:false, only_unworked:true}})
      .then(function(d){ closeWin(); toast('Заведено: ' + d.created); return load(); })
      .catch(function(e){ toast(e.message); });
    return;
  }
  if (what === 'proc-go') {
    var slug = $('win').querySelector('[data-x="proc-go"]').dataset.slug;
    api('/factory/lecture/' + encodeURIComponent(slug) + '/process', {method:'POST', body:{dry_run:false}})
      .then(function(d){ closeWin(); toast('Заготовок: ' + d.pieces); return load(); })
      .catch(function(e){ toast(e.message); });
    return;
  }
}

$('theme').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  $('theme').textContent = dark ? '☾' : '☀';
});
$('q').addEventListener('input', render);
$('newbtn').addEventListener('click', function(){ openPiece(null); });

if (KEY) load();

</script>
</body>
</html>
